name: Numeric V1 SDK parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: numeric-v1-sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-fixture-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-sdk-rust
      - name: Verify Rust-authored fixture freshness and outcomes
        run: cargo test --locked -p ivm --test ivm_group_06 numeric_v1_sdk_fixture
      - name: Verify the shared argument record through the Rust runtime
        run: >-
          cargo test --locked -p ivm --test ivm_group_05
          shared_sdk_fixture_is_generated_and_validated_by_rust
      - name: Verify exact JSON getters through the production Core host
        run: >-
          cargo test --locked -p ivm --lib
          exact_json_getters_accept_only_canonical_strings_through_core_host
      - name: Verify exact JSON getters through the production ledger host
        run: >-
          cargo test --locked -p iroha_core --lib
          exact_json_getters_accept_only_canonical_strings_through_ledger_host

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javascript/iroha_js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build the published distribution
        run: npm run build:dist
      - name: Verify pure source numeric paths
        run: node --test test/numericV1.test.js
      - name: Verify the shared contract boundary and complete canonical fixture corpus
        run: >-
          node --test
          test/kotodamaArgumentRecordFixture.test.js
          test/transactionFixturesParity.test.js
      - name: Verify pure browser numeric paths
        run: >-
          node --test
          --test-name-pattern="encodeQuantityNoritoValue enforces the nominal Quantity boundary|root entrypoints expose every declared typed Norito value encoder"
          test/norito.test.js
      - name: Verify pure quantity builder boundaries
        run: >-
          node --test
          --test-name-pattern="smart-contract manifest type declarations reject retired numeric names|CastPlainBallot pure-JS Norito codec preserves strict fractional Quantity|retired generic confidential instructions stay absent from builders and codec discriminants"
          test/instructionBuilders.test.js
      - name: Verify packaged quantity boundaries
        run: >-
          node --test
          --test-name-pattern="package dist quantity builders reject numbers and noncanonical strings"
          test/package_dist.test.js
      - name: Verify exact dynamic-access manifest policies
        run: >-
          node --test
          --test-name-pattern="dynamic-access|dynamic access|compiler manifest boundary rejects unknown"
          test/kotodamaCompiler.test.js
          test/toriiClient.test.js

  javascript-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: javascript/iroha_js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1-x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          shared-key: numeric-v1-sdk-js-native
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Provision the authenticated external Cargo lock
        working-directory: ${{ github.workspace }}
        run: >-
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH
          ci/privacy_sdk_cargo_lockfile.sh provision-ci
          "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/iroha-numeric-v1-sdk-cargo"
          "${GITHUB_ENV}"
          "${GITHUB_PATH}"
          "${HOME}/.cargo/bin/rustup"
          "1.93.1-x86_64-unknown-linux-gnu"
      - name: Verify Cargo lock isolation
        working-directory: ${{ github.workspace }}
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
      - name: Prime locked Cargo dependencies for the sealed offline build
        working-directory: ${{ github.workspace }}
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Build and publish the authenticated V3 native binding
        run: >-
          env
          PATH="${IROHA_PRIVACY_REAL_CARGO%/cargo}:${PATH}"
          npm run build:native
      - name: Verify native numeric builders and compiler bridge
        run: >-
          node --test
          test/instructionBuilders.test.js
          test/kotodamaCompiler.native.test.js
      - name: Verify final Cargo lock isolation
        if: always()
        working-directory: ${{ github.workspace }}
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Kotlin Numeric V1, quantity builders, and manifest policies
        run: >-
          ./gradlew :core-jvm:test
          --tests org.hyperledger.iroha.sdk.client.ContractManifestTest
          --tests org.hyperledger.iroha.sdk.client.ContractManifestJavaConsumerTest
          --tests org.hyperledger.iroha.sdk.numeric.NumericV1Test
          --tests org.hyperledger.iroha.sdk.core.model.instructions.InstructionQuantityTest
          --tests org.hyperledger.iroha.sdk.nexus.UaidJsonParserQuantityTest
          --tests org.hyperledger.iroha.sdk.client.HttpClientTransportTest.contractCallBoundaryConsumesSharedRustArgumentRecordFixture
          --tests org.hyperledger.iroha.sdk.tx.norito.TransactionFixtureParityTest
          --console=plain

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java/iroha_android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Java Numeric V1, quantity builders, and manifest policies
        env:
          ANDROID_HARNESS_MAINS: org.hyperledger.iroha.android.client.HttpClientTransportTests,org.hyperledger.iroha.android.client.SubscriptionToriiClientTests,org.hyperledger.iroha.android.nexus.UaidJsonParserTests,org.hyperledger.iroha.android.tx.TransactionFixtureManifestTests,org.hyperledger.iroha.android.tx.TransactionPayloadFixtureTests
        run: >-
          ./gradlew :core:test
          --tests org.hyperledger.iroha.android.GradleHarnessTests
          --tests org.hyperledger.iroha.android.numeric.NumericV1Tests
          --tests org.hyperledger.iroha.android.model.instructions.InstructionQuantityTests
          --console=plain

  swift:
    # This workflow does not own an authenticated ABI-29 Apple artifact handoff.
    # The release orchestrator must materialize NoritoBridge.xcframework outside
    # the checkout, set MOBILE_SDK_APPLE_ARTIFACT_DIR to that canonical directory,
    # and supply the source/tool identity required by check_mobile_sdk_artifacts.sh.
    # Missing input fails closed; never use or rebuild dist/NoritoBridge.xcframework.
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT: "1"
    defaults:
      run:
        working-directory: IrohaSwift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Materialize the authenticated external Apple Cargo lock
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          umask 077
          source ci/privacy_sdk_cargo_lockfile.sh
          lock_dir="$RUNNER_TEMP/iroha-mobile-apple-lock"
          mkdir -m 0700 "$lock_dir"
          lock_dir="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$lock_dir")"
          release_lock="$lock_dir/Cargo.lock"
          workspace_lock_state="present:$(privacy_sdk_file_seal "$GITHUB_WORKSPACE/Cargo.lock" "$MOBILE_SDK_PYTHON_BINARY")"
          privacy_sdk_materialize_canonical_cargo_lock \
            "$GITHUB_WORKSPACE" "$release_lock" "$workspace_lock_state" \
            "$MOBILE_SDK_PYTHON_BINARY"
          release_lock="$(IROHA_PRIVACY_CARGO_LOCKFILE_PATH="$release_lock" \
            privacy_sdk_resolve_cargo_lockfile "$GITHUB_WORKSPACE" "$MOBILE_SDK_PYTHON_BINARY")"
          echo "IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH=$release_lock" >> "$GITHUB_ENV"
      - name: Authenticate the externally provisioned ABI-29 Swift bridge
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -z "${MOBILE_SDK_APPLE_ARTIFACT_DIR:-}" ]]; then
            echo "an authenticated external ABI-29 Apple artifact handoff is required" >&2
            exit 1
          fi
          if [[ "$MOBILE_SDK_APPLE_ARTIFACT_DIR" != /* ]]; then
            echo "the ABI-29 Apple artifact directory must be absolute" >&2
            exit 1
          fi
          case "$MOBILE_SDK_APPLE_ARTIFACT_DIR" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "the ABI-29 Apple artifact directory must remain outside the checkout" >&2
              exit 1
              ;;
          esac
          scripts/check_mobile_sdk_artifacts.sh --apple-only --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Verify Swift Numeric V1, quantity builders, and manifest policies
        run: |
          swift test --filter NumericV1Tests
          swift test --filter TransactionEncoderValidationTests
          swift test --filter ToriiQuantityReadbackTests
          swift test --filter testContractManifestDynamicAccessHints
          swift test --filter ToriiClientTests/testContractCallBoundaryConsumesSharedRustArgumentRecordFixture

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/iroha_python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/iroha_python/requirements-ci.lock
      - name: Install hash-locked Python test dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements-ci.lock
      - name: Verify Python Numeric V1 fixture and manifest policy parity
        env:
          PYTHONPATH: src:../norito_py/src:..
        run: >-
          python -m pytest
          tests/client_contract_manifest_test.py
          tests/dependency_lock_test.py
          tests/numeric_v1_test.py
          tests/numeric_v1_quantity_test.py
          ../iroha_torii_client/tests/test_client.py::test_call_contract_preserves_shared_rust_argument_record_fixture

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Verify .NET Numeric V1, quantity builders, and manifest policies
        run: >-
          dotnet test tests/Hyperledger.Iroha.Sdk.Tests/Hyperledger.Iroha.Sdk.Tests.csproj
          --configuration Release
          --
          --filter-class Hyperledger.Iroha.Sdk.Tests.NumericV1Tests
          --filter-class Hyperledger.Iroha.Sdk.Tests.AssetQuantityInstructionTests
          --filter-class Hyperledger.Iroha.Sdk.Tests.ContractManifestTests
          --filter-class Hyperledger.Iroha.Sdk.Tests.NoritoRpcFixtureParityTests
