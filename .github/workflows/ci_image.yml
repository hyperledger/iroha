name: Build iroha2-ci image

on:
  workflow_dispatch:

env:
  IROHA_CI_BUILDER_IMAGE: ${{ vars.IROHA_CI_BUILDER_IMAGE }}

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned CI base image
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CI_BUILDER_IMAGE" \
            --runtime "$IROHA_CI_BUILDER_IMAGE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push iroha2-ci image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: true
          tags: hyperledger/iroha2-ci:nightly-2025-05-08
          labels: commit=${{ github.sha }}
          file: Dockerfile.build
          build-args: |
            "IROHA_CI_BUILDER_IMAGE=${{ env.IROHA_CI_BUILDER_IMAGE }}"
          # This context specification is required
          context: .
