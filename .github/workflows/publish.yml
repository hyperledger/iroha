name: Qualify Iroha 3 release candidates

on:
  push:
    tags:
      - "v3*"

env:
  CARGO_TERM_COLOR: always
  DEFAULTS_DIR: defaults
  IROHA_PROFILE: profiling
  IROHA_RUSTFLAGS: -C force-frame-pointers=on
  IROHA_FEATURES: profiling
  IROHA_CARGOFLAGS: -Z build-std
  IROHA_CI_IMAGE: ${{ vars.IROHA_CI_IMAGE }}
  IROHA_RUST_BUILDER_IMAGE: ${{ vars.IROHA_RUST_BUILDER_IMAGE }}
  IROHA_RUNTIME_IMAGE: ${{ vars.IROHA_RUNTIME_IMAGE }}

jobs:
  release-feature-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - name: Enforce reviewed shipping feature graphs
        run: python3 -I -S scripts/check_release_feature_graph.py

  candidate-no-profiling:
    needs: release-feature-graph
    runs-on: [self-hosted, Linux, iroha2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          install: true
          version: v0.34.1
      - name: Get the release tag
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          PREFIX='v'
          TAG=${RELEASE_VERSION#$PREFIX}
          echo "TAG=$TAG" >>$GITHUB_ENV
      - name: Build and load the Iroha 3 release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: iroha-release-candidate:${{ env.TAG }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare seed-matched signed genesis artifacts
        run: |
          umask 077
          bundle_root="$(mktemp -d "$RUNNER_TEMP/iroha-compose-genesis.XXXXXX")"
          echo "IROHA_GENESIS_BUNDLE_ROOT=$bundle_root" >> "$GITHUB_ENV"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$bundle_root,dst=/bundle" \
            --entrypoint kagami \
            "iroha-release-candidate:${TAG}" \
            localnet --seed Iroha --peers 4 --sora-profile nexus \
              --consensus-mode npos --out-dir /bundle > /dev/null
          test -s "$bundle_root/genesis.signed.nrt"
          test -s "$bundle_root/genesis.public_key"
          test -s "$bundle_root/genesis.expected_hash"
          echo "IROHA_GENESIS_SIGNED_FILE=$bundle_root/genesis.signed.nrt" >> "$GITHUB_ENV"
          echo "IROHA_GENESIS_PUBLIC_KEY_FILE=$bundle_root/genesis.public_key" >> "$GITHUB_ENV"
          echo "IROHA_GENESIS_EXPECTED_HASH_FILE=$bundle_root/genesis.expected_hash" >> "$GITHUB_ENV"
      - name: Prepare candidate tags for compose qualification
        run: |
          docker tag "iroha-release-candidate:${TAG}" hyperledger/iroha:local
          docker tag "iroha-release-candidate:${TAG}" hyperledger/iroha:dev
      - name: Test docker-compose.single.yml against the candidate
        run: |
          docker compose -p iroha-single-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml up --wait || {
            echo "docker-compose failed. Logs:";
            docker compose -p iroha-single-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml logs --tail="all";
            docker compose -p iroha-single-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml down --volumes --remove-orphans;
            exit 1;
          }
          docker compose -p iroha-single-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.single.yml down --volumes --remove-orphans
      - name: Test docker-compose.local.yml against the candidate
        run: |
          docker compose -p iroha-local-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml up --wait || {
            echo "docker-compose failed. Logs:";
            docker compose -p iroha-local-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml logs --tail="all";
            docker compose -p iroha-local-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml down --volumes --remove-orphans;
            exit 1;
          }
          docker compose -p iroha-local-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.local.yml down --volumes --remove-orphans
      - name: Test docker-compose.yml against the candidate
        run: |
          docker compose -p iroha-default-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.yml up --wait || {
            echo "docker-compose failed. Logs:";
            docker compose -p iroha-default-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.yml logs --tail="all";
            docker compose -p iroha-default-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.yml down --volumes --remove-orphans;
            exit 1;
          }
          docker compose -p iroha-default-${{ github.run_id }}-${{ github.run_attempt }} -f ${{ env.DEFAULTS_DIR }}/docker-compose.yml down --volumes --remove-orphans
      - name: Remove runtime-only prepared genesis bundle
        if: always()
        run: |
          case "${IROHA_GENESIS_BUNDLE_ROOT:-}" in
            "") exit 0 ;;
            "$RUNNER_TEMP"/iroha-compose-genesis.*) ;;
            *) echo "Refusing to remove an unexpected genesis bundle path" >&2; exit 1 ;;
          esac
          rm -rf -- "$IROHA_GENESIS_BUNDLE_ROOT"
      # Official publication is intentionally absent here. Promotion must use
      # scripts/run_release_pipeline.py and scripts/release_manifest_signing.py.
      # TODO(parliament anonymous ballot, P6): promotion must again require the
      # complete externally reviewed audit bundle for the anonymous-ballot relations.

  candidate-with-profiling:
    needs: release-feature-graph
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ vars.IROHA_CI_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CI_IMAGE" \
            --runtime "$IROHA_CI_IMAGE"
      - name: Get the release tag
        run: |
          RELEASE_VERSION=${{ github.ref_name }}
          PREFIX='v'
          TAG=${RELEASE_VERSION#$PREFIX}
          echo "TAG=$TAG" >>$GITHUB_ENV
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          install: true
          version: v0.34.1
      - name: Build and load the Iroha 3 profiling release candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          load: true
          tags: iroha-release-candidate:${{ env.TAG }}-${{ env.IROHA_PROFILE }}
          labels: commit=${{ github.sha }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
            "PROFILE=${{ env.IROHA_PROFILE }}"
            "RUSTFLAGS=${{ env.IROHA_RUSTFLAGS }}"
            "FEATURES=${{ env.IROHA_FEATURES }}"
            "CARGOFLAGS=${{ env.IROHA_CARGOFLAGS }}"
          context: .
