name: Publish (Dev CI/CD)

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  ARTIFACTS_DIR: tmp/artifacts
  BIN_PATH: /usr/local/bin
  IROHA_CI_IMAGE: ${{ vars.IROHA_CI_IMAGE }}
  IROHA_RUST_BUILDER_IMAGE: ${{ vars.IROHA_RUST_BUILDER_IMAGE }}
  IROHA_RUNTIME_IMAGE: ${{ vars.IROHA_RUNTIME_IMAGE }}

jobs:
  release-feature-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - name: Enforce reviewed shipping feature graphs
        run: python3 -I -S scripts/check_release_feature_graph.py

  dev_image:
    needs: release-feature-graph
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ vars.IROHA_CI_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CI_IMAGE" \
            --runtime "$IROHA_CI_IMAGE"
      - name: Set up Docker Buildx
        id: buildx
        if: always()
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.34.1
          install: true
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Soramitsu Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Build and push iroha:dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            hyperledger/iroha:dev
            docker.soramitsu.co.jp/iroha3/iroha:dev
          labels: commit=${{ github.sha }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger_sdk_tests:
    runs-on: ubuntu-latest
    needs: dev_image
    steps:
      - name: Trigger Iroha Python tests
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hyperledger-iroha/iroha-python/dispatches \
            -d '{"event_type":"dispatch-event"}'
      - name: Trigger Iroha Java tests
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hyperledger-iroha/iroha-java/dispatches \
            -d '{"event_type":"allure-upload-trigger"}'
