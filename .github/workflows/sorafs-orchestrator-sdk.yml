name: SoraFS orchestrator SDK parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".cargo/**"
      - ".github/workflows/sorafs-orchestrator-sdk.yml"
      - ".github/workflows/mobile_sdk_artifacts.yml"
      - ".github/workflows/pr_csharp.yml"
      - "ci/sdk_sorafs_orchestrator.sh"
      - "ci/check_sorafs_python_native_sdk.sh"
      - "codec/**"
      - "scripts/deploy_localnet.sh"
      - "scripts/tests/deploy_localnet_test.py"
      - "gradle/mobile-sdk-external-android-build.settings.gradle.kts"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/exec_with_file_lock.py"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/tests/mobile_sdk_apple_lock_workflow_test.py"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/norito_bridge_apple_slice_handoff.py"
      - "scripts/package_mobile_sdk_artifacts.sh"
      - "scripts/run_mobile_hermetic_command.py"
      - "crates/connect_norito_bridge/**"
      - "crates/iroha_js_host/**"
      - "crates/iroha_cli/**"
      - "crates/iroha_config/**"
      - "crates/iroha_core/**"
      - "crates/iroha_core_privacy/**"
      - "crates/iroha_core_timed_ovn/**"
      - "crates/iroha_core_zk/**"
      - "crates/iroha_panic_hook/**"
      - "crates/iroha_data_model/**"
      - "crates/iroha_kagami/**"
      - "crates/iroha_torii/**"
      - "crates/irohad/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "crates/sorafs_manifest/**"
      - "crates/sorafs_orchestrator/**"
      - "python/iroha_python/**"
      - "python/iroha_torii_client/**"
      - "javascript/iroha_js/**"
      - "IrohaSwift/**"
      - "kotlin/**"
      - "java/iroha_android/**"
      - "java/norito_java/**"
      - "csharp/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "fixtures/sorafs_orchestrator/multi_peer_parity_v1/**"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/check_native_sdk_artifact.py"
      - "scripts/compute_workspace_source_manifest.py"
      - "scripts/tests/check_native_sdk_artifact_test.py"
      - "scripts/tests/check_sorafs_python_native_sdk_evidence_contract.sh"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "scripts/sorafs_javascript_test_events.mjs"
      - "scripts/tests/sorafs_javascript_test_events_test.mjs"
      - "scripts/sorafs_javascript_child.mjs"
      - "scripts/sorafs_javascript_child_entry.mjs"
      - "scripts/sorafs_javascript_child_input.mjs"
      - "scripts/sorafs_javascript_child_loads.mjs"
      - "scripts/sorafs_javascript_child_session.mjs"
      - "scripts/tests/sorafs_javascript_child_fixture.mjs"
      - "scripts/tests/sorafs_javascript_child_input_test.mjs"
      - "scripts/tests/sorafs_javascript_child_loads_test.mjs"
      - "scripts/tests/sorafs_javascript_child_contract_test.mjs"
      - "scripts/tests/sorafs_javascript_child_session_test.mjs"
      - "scripts/tests/sorafs_javascript_child_abi_contract_test.py"
      - "specs/sorafs/javascript_child_bootstrap_v1.md"
      - "scripts/sorafs_javascript_child_tools.py"
      - "scripts/sorafs_javascript_input_files.py"
      - "scripts/sorafs_javascript_parent_input.py"
      - "scripts/tests/sorafs_javascript_input_files_test.py"
      - "scripts/tests/sorafs_javascript_parent_input_test.py"
      - "specs/sorafs/javascript_parent_input_v1.md"
      - "scripts/sorafs_javascript_runtime_graph.py"
      - "scripts/sorafs_javascript_runtime_inputs.py"
      - "scripts/tests/sorafs_javascript_runtime_inputs_test.py"
      - "scripts/sorafs_javascript_runtime_custody.py"
      - "scripts/tests/sorafs_javascript_runtime_custody_test.py"
      - "scripts/sorafs_javascript_child_process.py"
      - "scripts/tests/sorafs_javascript_child_process_test.py"
      - "specs/sorafs/javascript_runtime_inputs_v1.md"
      - "scripts/macho_decoder.py"
      - "scripts/tests/macho_decoder_test.py"
      - "scripts/sorafs_python_consumer_artifact.py"
      - "scripts/sorafs_python_consumer_cases.py"
      - "ci/verify_privacy_python_wheel.py"
      - "ci/python_native_source_delivery.py"
      - "scripts/tests/python_native_source_delivery_test.py"
      - "scripts/tests/python_source_owner_admission_test.py"
      - "scripts/tests/python_native_delivery_gate_contract_test.py"
      - "scripts/requirements.txt"
      - "ci/check_sorafs_cli_release.sh"
      - "scripts/sorafs_javascript_native_cache.mjs"
      - "scripts/fixtures/sorafs_javascript_qualification_sources_v1.json"
      - "scripts/sorafs_javascript_child_files.mjs"
      - "scripts/tests/sorafs_javascript_child_files_test.mjs"
      - "scripts/check_sorafs_release_automation.py"
      - "scripts/tests/check_sorafs_release_automation_test.py"
      - "scripts/check_sorafs_mobile_parity_reports.py"
      - "scripts/tests/check_sorafs_mobile_parity_reports_test.py"
      - "scripts/sorafs_evidence_json.py"
      - "scripts/sorafs_evidence_paths.py"
      - "scripts/sorafs_evidence_sensitivity.py"
      - "scripts/sorafs_path_identity.py"
      - "tools/kotlin-fixture-gen/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "vendor/**"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-parity:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: never
      IROHA_JS_NATIVE_BUILD_PROFILE: "release"
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify Python ABI-30 evidence retention contract
        run: bash scripts/tests/check_sorafs_python_native_sdk_evidence_contract.sh
      - name: Bind the canonical mobile Python
        run: |
          mobile_python="$(python3 -I -S -c '
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from sorafs_path_identity import resolve_path_identity
          errors = []
          identity = resolve_path_identity(Path(sys.executable), errors, label="mobile SDK Python")
          if identity is None or errors:
              raise SystemExit("mobile SDK Python path identity could not be resolved")
          print(identity)
          ')"
          [[ "$("$mobile_python" -I -S -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-sdk
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/iroha_js/package-lock.json
      - name: Verify fixed JavaScript child-custody ownership
        run: node --test scripts/tests/sorafs_javascript_test_events_test.mjs scripts/tests/sorafs_javascript_child_files_test.mjs scripts/tests/sorafs_javascript_child_input_test.mjs scripts/tests/sorafs_javascript_child_loads_test.mjs scripts/tests/sorafs_javascript_child_session_test.mjs
      - name: Install Apple Rust targets
        run: |
          resolve_mobile_tool() {
            "$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c '
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from sorafs_path_identity import resolve_path_identity
          errors = []
          identity = resolve_path_identity(Path(sys.argv[1]), errors, label="mobile SDK Rustup")
          if identity is None or errors:
              raise SystemExit("mobile SDK Rustup path identity could not be resolved")
          print(identity)
          ' "$1"
          }
          rustup_source="$(command -v rustup)"
          rustup_source="$(resolve_mobile_tool "$rustup_source")"
          [[ "$rustup_source" == /* && -f "$rustup_source" && ! -L "$rustup_source" && -x "$rustup_source" ]]
          rustup_tools="$RUNNER_TEMP/iroha-sorafs-apple-tools"
          mkdir -p "$rustup_tools"
          chmod 0700 "$rustup_tools"
          rustup_path="$rustup_tools/rustup"
          test ! -e "$rustup_path"
          /bin/cp "$rustup_source" "$rustup_path"
          chmod 0700 "$rustup_path"
          rustup_path="$(resolve_mobile_tool "$rustup_path")"
          [[ "$rustup_path" == /* && "${rustup_path##*/}" == rustup && -f "$rustup_path" && ! -L "$rustup_path" && -x "$rustup_path" ]]
          echo "MOBILE_SDK_RUSTUP_BINARY=$rustup_path" >> "$GITHUB_ENV"
          "$rustup_path" target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-sorafs-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(cd "$cargo_target" && pwd -P)"
          rustc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustc)"
          rustdoc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Apple native artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-sorafs-sdk-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-sorafs-sdk-apple-build"
          mkdir -p "$artifact_dir" "$build_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
      - name: Materialize the authenticated external Apple Cargo lock
        shell: bash
        run: |
          umask 077
          source ci/privacy_sdk_cargo_lockfile.sh
          lock_dir="$RUNNER_TEMP/iroha-mobile-apple-lock"
          mkdir -m 0700 "$lock_dir"
          lock_dir="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$lock_dir")"
          release_lock="$lock_dir/Cargo.lock"
          workspace_lock_state="present:$(privacy_sdk_file_seal "$GITHUB_WORKSPACE/Cargo.lock" "$MOBILE_SDK_PYTHON_BINARY")"
          privacy_sdk_materialize_canonical_cargo_lock \
            "$GITHUB_WORKSPACE" "$release_lock" "$workspace_lock_state" \
            "$MOBILE_SDK_PYTHON_BINARY"
          release_lock="$(IROHA_PRIVACY_CARGO_LOCKFILE_PATH="$release_lock" \
            privacy_sdk_resolve_cargo_lockfile "$GITHUB_WORKSPACE" "$MOBILE_SDK_PYTHON_BINARY")"
          echo "IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH=$release_lock" >> "$GITHUB_ENV"
      - name: Build exact ABI-30 NoritoBridge XCFramework
        run: scripts/build_norito_xcframework.sh --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Authenticate Apple native artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Run exact Python 3.12 ABI-30 native reference parity
        env:
          SORAFS_PYTHON_SDK_EVIDENCE_DIR: ${{ runner.temp }}/iroha-sorafs-python-native-abi30-evidence
          SORAFS_PYTHON_SDK_PYTHON_BIN: python3
        run: bash ci/check_sorafs_python_native_sdk.sh
      - name: Run Rust, Python, JavaScript, and Swift fixture parity
        run: bash ci/sdk_sorafs_orchestrator.sh
      - name: Upload verified Python ABI-30 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-python-native-abi30-${{ github.run_id }}
          path: ${{ runner.temp }}/iroha-sorafs-python-native-abi30-evidence/python-native-abi30.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-orchestrator-sdk-${{ github.run_id }}
          path: |
            artifacts/sorafs_orchestrator_sdk/
            !artifacts/sorafs_orchestrator_sdk/latest
          if-no-files-found: error
          retention-days: 30

  mobile-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_PLATFORM_PACKAGE: platforms;android-35
      ANDROID_BUILD_TOOLS_PACKAGE: build-tools;35.0.0
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c '
          import sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from sorafs_path_identity import resolve_path_identity
          errors = []
          identity = resolve_path_identity(Path(sys.executable), errors, label="mobile SDK Python")
          if identity is None or errors:
              raise SystemExit("mobile SDK Python path identity could not be resolved")
          print(identity)
          ')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-mobile-parity
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set by the runner" >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          sdkmanager_status="${PIPESTATUS[1]}"
          set -e
          if [[ "$sdkmanager_status" -ne 0 ]]; then
            echo "sdkmanager license acceptance failed with status $sdkmanager_status" >&2
            exit "$sdkmanager_status"
          fi
          "$sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - name: Fetch the locked Rust dependency graph
        run: cargo fetch --locked
      - name: Build and authenticate the exact ABI-30 Kotlin bridge
        shell: bash
        run: |
          target=x86_64-unknown-linux-gnu
          native_root="$RUNNER_TEMP/sorafs-mobile-native"
          test ! -e "$native_root"
          mkdir -m 0700 "$native_root"
          cargo build --locked --offline --release -p connect_norito_bridge \
            --target "$target" --target-dir "$native_root/cargo-target"
          cargo build --locked --offline --release -p kotlin-fixture-gen \
            --features dev-tools --bin kotlin-fixture-gen \
            --target "$target" --target-dir "$native_root/cargo-target"
          native_dir="$native_root/cargo-target/$target/release"
          artifact="$native_dir/libconnect_norito_bridge.so"
          manifest="$native_root/native-sdk-abi30.json"
          python3 -I scripts/check_native_sdk_artifact.py record \
            --artifact "$artifact" --manifest "$manifest" \
            --source-root "$GITHUB_WORKSPACE" --sdk c-jni --target "$target"
          python3 -I scripts/check_native_sdk_artifact.py verify \
            --artifact "$artifact" --manifest "$manifest" \
            --source-root "$GITHUB_WORKSPACE"
          echo "IROHA_NATIVE_LIBRARY_PATH=$native_dir" >> "$GITHUB_ENV"
          echo "IROHA_KOTLIN_FIXTURE_GEN_BIN=$native_dir/kotlin-fixture-gen" >> "$GITHUB_ENV"
          echo "SORAFS_MOBILE_NATIVE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Prepare canonical Kotlin test outputs
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/sorafs-mobile-parity"
          test ! -e "$artifact_dir"
          mkdir -m 0700 "$artifact_dir"
          echo "MOBILE_SDK_ANDROID_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
      - name: Require fresh ABI-30 JNI bridge in complete Kotlin and Java suites
        working-directory: kotlin
        shell: bash
        run: |
          # core-jvm includes Java-source consumers of the canonical Kotlin API.
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_ARTIFACT_DIR/project-cache" \
            :core-jvm:test :tools:test \
            :client-android:testDebugUnitTest \
            :client-android:testDebugHostNative \
            :kagemusha-wallet-android:testDebugUnitTest --console=plain
      - name: Validate every mobile parity test lane
        shell: bash
        run: |
          python3 -I scripts/check_sorafs_mobile_parity_reports.py \
            --report-root "$MOBILE_SDK_ANDROID_ARTIFACT_DIR/gradle-build/iroha_kotlin_sdk" \
            > "$MOBILE_SDK_ANDROID_ARTIFACT_DIR/test-execution.json"
      - name: Reauthenticate the consumed Kotlin bridge
        shell: bash
        run: |
          python3 -I scripts/check_native_sdk_artifact.py verify \
            --artifact "$IROHA_NATIVE_LIBRARY_PATH/libconnect_norito_bridge.so" \
            --manifest "$SORAFS_MOBILE_NATIVE_MANIFEST" \
            --source-root "$GITHUB_WORKSPACE"
      - name: Upload Kotlin and Java native parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sorafs-orchestrator-mobile-parity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sorafs-mobile-native/native-sdk-abi30.json
            ${{ runner.temp }}/sorafs-mobile-parity/test-execution.json
            ${{ runner.temp }}/sorafs-mobile-parity/gradle-build/iroha_kotlin_sdk/*/test-results/**/TEST-*.xml
          if-no-files-found: error
          retention-days: 30

  csharp-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sorafs-orchestrator-csharp-parity
      - name: Build and authenticate the exact ABI-30 C# bridge
        shell: bash
        run: |
          target=x86_64-unknown-linux-gnu
          cargo build --locked --release -p connect_norito_bridge --target "$target"
          native_dir="$RUNNER_TEMP/sorafs-csharp-native"
          artifact="$native_dir/libconnect_norito_bridge.so"
          manifest="$native_dir/native-sdk-abi30.json"
          mkdir -p "$native_dir"
          cp "target/$target/release/libconnect_norito_bridge.so" "$artifact"
          python3 -I scripts/check_native_sdk_artifact.py record \
            --artifact "$artifact" \
            --manifest "$manifest" \
            --source-root "$GITHUB_WORKSPACE" \
            --sdk csharp \
            --target "$target"
          python3 -I scripts/check_native_sdk_artifact.py verify \
            --artifact "$artifact" \
            --manifest "$manifest" \
            --source-root "$GITHUB_WORKSPACE"
          echo "LD_LIBRARY_PATH=$native_dir" >> "$GITHUB_ENV"
      - name: Restore C# dependencies
        working-directory: csharp
        run: dotnet restore Hyperledger.Iroha.Sdk.sln
      - name: Build C# SDK with warnings denied
        working-directory: csharp
        run: dotnet build Hyperledger.Iroha.Sdk.sln -c Release --no-restore -warnaserror
      - name: Run complete C# ABI-30 parity suite
        working-directory: csharp
        run: dotnet test Hyperledger.Iroha.Sdk.sln -c Release --no-build
