concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  privacy_native_bridge_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host-qualified privacy SDK Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - name: Provision private privacy SDK Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-sdk-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu"
      - name: Verify privacy SDK Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
      - name: Prime privacy native Cargo dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Privacy native bridge tests
        run: cargo test -p connect_norito_bridge privacy_ --lib -- --test-threads=1
      - name: Verify final privacy SDK Cargo lock isolation
        if: always()
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}"
  privacy_swift_sdk_parse:
    needs: privacy_jvm_sdk_tests
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: privacy-swift-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Bind the canonical privacy Swift Python
        env:
          SETUP_PYTHON_PATH: ${{ steps.privacy-swift-python.outputs.python-path }}
        run: |
          mobile_python="$("$SETUP_PYTHON_PATH" -I -S -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
          echo "PRIVACY_SWIFT_SDK_PYTHON_BIN=$mobile_python" >> "$GITHUB_ENV"
      - name: Install host-qualified privacy Swift Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-aarch64-apple-darwin" \
              --profile minimal \
              --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.93.1-aarch64-apple-darwin" >> "$GITHUB_ENV"
      - name: Download frozen source-bound privacy lock input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-jvm-native-abi30-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-jvm-native-abi30
      - name: Authenticate canonical privacy graph snapshot
        run: |
          source ci/privacy_sdk_cargo_lockfile.sh
          release_lock="$RUNNER_TEMP/privacy-jvm-native-abi30/Cargo.lock"
          [[ "$("$MOBILE_SDK_PYTHON_BINARY" -I -S -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$release_lock")" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          [[ "$("$MOBILE_SDK_PYTHON_BINARY" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          cmp -s "$release_lock" Cargo.lock
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH=$release_lock" >> "$GITHUB_ENV"
      - name: Prepare external privacy Swift build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-privacy-swift-artifacts"
          build_dir="$RUNNER_TEMP/iroha-privacy-swift-build"
          scratch_dir="$RUNNER_TEMP/iroha-privacy-swift-tests"
          mkdir -p "$artifact_dir" "$build_dir" "$scratch_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_SWIFT_SCRATCH_DIR=$scratch_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
      - name: Install Apple Rust targets and prime frozen dependencies
        run: |
          rustup target add --toolchain 1.93.1-aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo_path="$(rustup which --toolchain 1.93.1-aarch64-apple-darwin cargo)"
          env -u RUSTC_BOOTSTRAP "$cargo_path" fetch --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
      - name: Bind the external privacy Swift Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-privacy-swift-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$(rustup which --toolchain 1.93.1-aarch64-apple-darwin rustc)" >> "$GITHUB_ENV"
          echo "RUSTDOC=$(rustup which --toolchain 1.93.1-aarch64-apple-darwin rustdoc)" >> "$GITHUB_ENV"
      - name: Make reviewed privacy Swift source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Swift privacy native fail-closed contract
        run: python3 -I -B scripts/tests/check_privacy_swift_native_contract_test.py
      - name: Rebuild exact ABI30 XCFramework under full Xcode
        run: scripts/build_norito_xcframework.sh --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Privacy Swift SDK parse and native ABI30 tests
        run: ci/check_privacy_swift_sdk.sh
      - name: Revalidate frozen Swift inputs and ABI30 artifacts
        if: always()
        run: |
          source ci/privacy_sdk_cargo_lockfile.sh
          [[ "$("$MOBILE_SDK_PYTHON_BINARY" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          [[ "$("$MOBILE_SDK_PYTHON_BINARY" -I -S -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH")" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          scripts/check_mobile_sdk_artifacts.sh --apple-only --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"

  privacy_jvm_sdk_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"
      - id: privacy-jvm-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Install host-qualified privacy JVM Rust toolchain
        shell: bash
        run: |
          env -i \
            HOME="${HOME}" \
            RUSTUP_DIST_SERVER="https://static.rust-lang.org" \
            "${HOME}/.cargo/bin/rustup" toolchain install \
              "1.93.1-x86_64-unknown-linux-gnu" \
              --profile minimal \
              --no-self-update
      - name: Provision private privacy JVM Cargo lock
        shell: bash
        run: |
          env -u PKG_CONFIG_PATH -u LD_LIBRARY_PATH \
            ci/privacy_sdk_cargo_lockfile.sh provision-ci \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/iroha-privacy-jvm-cargo" \
            "${GITHUB_ENV}" \
            "${GITHUB_PATH}" \
            "${HOME}/.cargo/bin/rustup" \
            "1.93.1-x86_64-unknown-linux-gnu" \
            "${{ steps.privacy-jvm-python.outputs.python-path }}"
      - name: Verify privacy JVM Cargo lock isolation
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-jvm-python.outputs.python-path }}"
      - name: Prime privacy JVM native dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Privacy JVM and Java SDK native ABI30 tests
        env:
          PRIVACY_JVM_SDK_PYTHON_BIN: ${{ steps.privacy-jvm-python.outputs.python-path }}
          PRIVACY_JVM_NATIVE_EXPORT_DIR: ${{ runner.temp }}/privacy-jvm-native-abi30
        run: ci/check_privacy_jvm_sdk.sh
      - name: Upload source-bound privacy JVM native ABI30 input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-jvm-native-abi30-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-jvm-native-abi30
          if-no-files-found: error
          retention-days: 1
      - name: Verify final privacy JVM Cargo lock isolation
        if: always()
        run: ci/privacy_sdk_cargo_lockfile.sh verify-ci "${GITHUB_WORKSPACE}" "${{ steps.privacy-jvm-python.outputs.python-path }}"

  privacy_csharp_sdk_tests:
    needs: privacy_jvm_sdk_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IROHA_REQUIRE_PRIVACY_EXACT12_NATIVE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - id: privacy-csharp-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          update-environment: false
      - name: Download source-bound privacy native ABI30 input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: privacy-jvm-native-abi30-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-jvm-native-abi30
      - name: Authenticate exact ABI30 C# privacy input
        env:
          PRIVACY_CSHARP_PYTHON: ${{ steps.privacy-csharp-python.outputs.python-path }}
        run: |
          input="$RUNNER_TEMP/privacy-jvm-native-abi30"
          source ci/privacy_sdk_cargo_lockfile.sh
          [[ "$("$PRIVACY_CSHARP_PYTHON" -I -S -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$input/Cargo.lock")" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          [[ "$("$PRIVACY_CSHARP_PYTHON" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          "$PRIVACY_CSHARP_PYTHON" -I -S scripts/check_native_sdk_artifact.py verify \
            --artifact "$input/libconnect_norito_bridge.so" \
            --manifest "$input/native-sdk-abi30-csharp.json" \
            --source-root "$GITHUB_WORKSPACE"
      - name: Privacy C# SDK tests through authenticated ABI30
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/privacy-jvm-native-abi30
          PRIVACY_CSHARP_NATIVE_ARTIFACT: ${{ runner.temp }}/privacy-jvm-native-abi30/libconnect_norito_bridge.so
          PRIVACY_CSHARP_NATIVE_MANIFEST: ${{ runner.temp }}/privacy-jvm-native-abi30/native-sdk-abi30-csharp.json
          PRIVACY_CSHARP_PYTHON_BIN: ${{ steps.privacy-csharp-python.outputs.python-path }}
        run: ci/check_privacy_csharp_sdk.sh
      - name: Revalidate ABI30 C# privacy input after execution
        if: always()
        env:
          PRIVACY_CSHARP_PYTHON: ${{ steps.privacy-csharp-python.outputs.python-path }}
        run: |
          input="$RUNNER_TEMP/privacy-jvm-native-abi30"
          "$PRIVACY_CSHARP_PYTHON" -I -S scripts/check_native_sdk_artifact.py verify \
            --artifact "$input/libconnect_norito_bridge.so" \
            --manifest "$input/native-sdk-abi30-csharp.json" \
            --source-root "$GITHUB_WORKSPACE"

  privacy_javascript_sdk_tests:
