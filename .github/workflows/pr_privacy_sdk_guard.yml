          [[ "$("$PRIVACY_JS_PYTHON" -I -S -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest())')" == "${PRIVACY_SDK_CANONICAL_CARGO_LOCK_SHA256}" ]]
          cmp -s "$release_lock" Cargo.lock
