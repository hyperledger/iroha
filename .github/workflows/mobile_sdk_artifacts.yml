name: Mobile SDK Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile_sdk_artifacts.yml"
      - "Makefile"
      - "scripts/build_norito_xcframework.sh"
      - "scripts/archive_norito_xcframework.py"
      - "scripts/tests/archive_norito_xcframework_test.py"
      - "scripts/validate_norito_bridge_archive.py"
      - "scripts/tests/validate_norito_bridge_archive_test.py"
      - "scripts/check_swift_release_consumers.py"
      - "scripts/tests/check_swift_release_consumers_test.py"
      - "scripts/fixtures/swift_release_consumers/**"
      - "scripts/tests/norito_bridge_source_seal_test.py"
      - "scripts/norito_bridge_apple_slice_handoff.py"
      - "scripts/tests/norito_bridge_apple_slice_handoff_test.py"
      - "scripts/tests/package_mobile_sdk_artifacts_test.py"
      - "scripts/tests/mobile_sdk_apple_lock_workflow_test.py"
      - "scripts/tests/swift_native_export_retention_test.py"
      - "scripts/update_norito_bridge_swift_pins.py"
      - "scripts/tests/update_norito_bridge_swift_pins_test.py"
      - "scripts/validate_norito_bridge_xcframework.py"
      - "scripts/tests/validate_norito_bridge_xcframework_test.py"
      - "scripts/exec_with_file_lock.py"
      - "scripts/tests/exec_with_file_lock_test.py"
      - "scripts/check_mobile_sdk_artifact_pin_commit.py"
      - "scripts/check_mobile_sdk_artifacts.sh"
      - "scripts/mobile_sdk_android_artifacts.py"
      - "scripts/mobile_sdk_android_package_inputs.py"
      - "scripts/android_sbom_provenance.sh"
      - "scripts/publish_android_sdk.sh"
      - "scripts/android_publish_snapshot.sh"
      - "scripts/mobile_sdk_android_publication.py"
      - "scripts/tests/android_publication_contract_test.py"
      - "scripts/run_release_pipeline.py"
      - "scripts/tests/release_profile_validation_test.py"
      - "scripts/tests/mobile_sdk_android_artifacts_test.py"
      - "scripts/check_mobile_sdk_artifacts_test.sh"
      - "scripts/tests/mobile_sdk_python312_contract.sh"
      - "scripts/check_android_app_native_archive.py"
      - "scripts/tests/check_android_app_native_archive_test.py"
      - "scripts/norito_bridge_source_seal.py"
      - "scripts/run_mobile_hermetic_command.py"
      - "scripts/check_kotlin_no_reflection.sh"
      - "scripts/tests/check_kotlin_no_reflection_test.py"
      - "scripts/check_kotlin_jni.py"
      - "scripts/jvm_classfile.py"
      - "scripts/tests/check_kotlin_jni_test.py"
      - "scripts/android_keystore_attestation.sh"
      - "scripts/tests/android_keystore_attestation_launcher_test.py"
      - "scripts/android_strongbox_attestation_ci.sh"
      - "scripts/android_strongbox_attestation_report.py"
      - "scripts/tests/android_strongbox_attestation_report_test.py"
      - "ci/check_android_transport_guard.sh"
      - "scripts/deploy_localnet.sh"
      - "scripts/tests/deploy_localnet_test.py"
      - "scripts/package_mobile_sdk_artifacts.sh"
      - "scripts/check_sorafs_release_automation.py"
      - "scripts/tests/check_sorafs_release_automation_test.py"
      - "IrohaSwift/**"
      - "kotlin/**"
      - "java/iroha_android/**"
      - "crates/connect_norito_bridge/**"
