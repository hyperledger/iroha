      - "crates/iroha_kagami/**"
      - "crates/iroha_torii/**"
      - "crates/irohad/**"
      - "crates/iroha_core/src/smartcontracts/isi/mod.rs"
      - "crates/iroha_core/src/smartcontracts/isi/escrow.rs"
      - "crates/iroha_data_model/src/bin/cancel_asset_lock_fixtures.rs"
      - "crates/iroha_data_model/src/escrow.rs"
      - "crates/iroha_data_model/src/events/data/escrow.rs"
      - "crates/iroha_data_model/src/isi/mod.rs"
      - "crates/iroha_data_model/src/isi/escrow.rs"
      - "crates/iroha_data_model/src/isi/registry.rs"
      - "crates/iroha_data_model/src/testing/cancel_asset_lock.rs"
      - "crates/kotodama_lang/src/samples/native_escrow.ko"
      - "crates/kotodama_lang/src/samples/native_escrow.to"
      - "crates/sorafs_manifest/**"
      - "fixtures/sorafs_manifest/appeal_finance/**"
      - "fixtures/sorafs_manifest/governance/**"
      - "fixtures/sorafs_manifest/reference_sdk/**"
      - "fixtures/sorafs_manifest/reference_sdk_validation_inventory_v1.json"
      - "integration_tests/tests/native_escrow.rs"
      - "scripts/check_sorafs_reference_sdk_fixtures.py"
      - "scripts/check_native_sdk_artifact.py"
      - "scripts/compute_workspace_source_manifest.py"
      - "scripts/tests/check_native_sdk_artifact_test.py"
      - "scripts/tests/check_sorafs_fixture_workflow_contract_test.py"
      - "roadmap.md"
      - "specs/sorafs/v1_closure_ledger.md"
      - "specs/sorafs_reference_sdk_plan.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version override; defaults to tag, PR number, or commit."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_PLATFORM_PACKAGE: platforms;android-35
  ANDROID_BUILD_TOOLS_PACKAGE: build-tools;35.0.0
  ANDROID_NDK_VERSION: 28.0.12674087

jobs:
  checker-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject a noncanonical release tag before setup or build
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "tagged mobile SDK releases are owned by hyperledger-iroha/iroha" >&2
            exit 1
          }
          IFS= read -r bridge_version < IrohaSwift/VERSION
          [[ "$bridge_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version_bytes="$(wc -c < IrohaSwift/VERSION | tr -d '[:space:]')"
          [[ "$version_bytes" == "$(( ${#bridge_version} + 1 ))" ]] || {
            echo "IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "v${bridge_version}" ]] || {
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${bridge_version}" >&2
            exit 1
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - name: Enforce reviewed shipping feature graphs
        run: python3 -I -S scripts/check_release_feature_graph.py
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - name: Install pinned checker dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Shell syntax
        run: bash -n scripts/publish_android_sdk.sh scripts/android_publish_snapshot.sh scripts/android_sbom_provenance.sh scripts/android_keystore_attestation.sh scripts/build_norito_xcframework.sh scripts/check_kotlin_no_reflection.sh scripts/check_mobile_sdk_artifacts.sh scripts/check_mobile_sdk_artifacts_test.sh scripts/deploy_localnet.sh scripts/package_mobile_sdk_artifacts.sh scripts/tests/mobile_sdk_python312_contract.sh
      - name: Python syntax
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/mobile-sdk-pycache" python3 -I -S -B -m py_compile scripts/archive_norito_xcframework.py scripts/tests/archive_norito_xcframework_test.py scripts/validate_norito_bridge_archive.py scripts/tests/validate_norito_bridge_archive_test.py scripts/tests/norito_bridge_source_seal_test.py scripts/norito_bridge_apple_slice_handoff.py scripts/tests/norito_bridge_apple_slice_handoff_test.py scripts/tests/package_mobile_sdk_artifacts_test.py scripts/update_norito_bridge_swift_pins.py scripts/tests/update_norito_bridge_swift_pins_test.py scripts/validate_norito_bridge_xcframework.py scripts/tests/validate_norito_bridge_xcframework_test.py scripts/check_android_app_native_archive.py scripts/tests/check_android_app_native_archive_test.py scripts/check_native_sdk_artifact.py scripts/tests/check_native_sdk_artifact_test.py scripts/exec_with_file_lock.py scripts/tests/exec_with_file_lock_test.py scripts/norito_bridge_source_seal.py scripts/run_mobile_hermetic_command.py scripts/mobile_sdk_android_package_inputs.py scripts/mobile_sdk_android_publication.py scripts/tests/android_publication_contract_test.py
      - name: Deterministic NoritoBridge archive owner fixtures
        run: python3 -I -S -B scripts/tests/archive_norito_xcframework_test.py
      - name: NoritoBridge authenticated SwiftPM archive fixtures
        run: python3 -I -S -B scripts/tests/validate_norito_bridge_archive_test.py
      - name: SwiftPM Release consumer runner fixtures
        run: python3 -I -S -B scripts/tests/check_swift_release_consumers_test.py
      - name: NoritoBridge source seal fixtures
        run: python3 -I -S -B scripts/tests/norito_bridge_source_seal_test.py
      - name: NoritoBridge Apple slice handoff fixtures
        run: python3 -I -S -B scripts/tests/norito_bridge_apple_slice_handoff_test.py
      - name: Atomic mobile SDK package publisher fixtures
        run: python3 -I -S -B scripts/tests/package_mobile_sdk_artifacts_test.py
      - name: NoritoBridge Swift pin owner fixtures
        run: python3 -I -S -B scripts/tests/update_norito_bridge_swift_pins_test.py
      - name: NoritoBridge XCFramework validator fixtures
        run: python3 -I -S -B scripts/tests/validate_norito_bridge_xcframework_test.py
      - name: Shared output lock fixtures
        run: python3 -I -S -B scripts/tests/exec_with_file_lock_test.py
      - name: Host native ABI-31 artifact checker fixtures
        run: python3 -B -m pytest -q scripts/tests/check_native_sdk_artifact_test.py
      - name: Android app native archive authenticator fixtures
        run: python3 -I -B scripts/tests/check_android_app_native_archive_test.py
      - name: Kotlin reflection and attestation launcher contracts
        run: >-
          python3 -B -m pytest -q
          scripts/tests/check_kotlin_no_reflection_test.py
          scripts/tests/check_kotlin_jni_test.py
          scripts/tests/android_keystore_attestation_launcher_test.py
          scripts/tests/android_strongbox_attestation_report_test.py
      - name: Kotlin production reflection guard
        run: scripts/check_kotlin_no_reflection.sh
      - name: Artifact checker fixture tests
        run: bash scripts/check_mobile_sdk_artifacts_test.sh
      - name: Canonical Kotlin output and SBOM ownership fixtures
        run: python3 -I -S -B scripts/tests/mobile_sdk_android_artifacts_test.py
      - name: Canonical Kotlin local and remote publication contracts
        run: python3 -I -S -B scripts/tests/android_publication_contract_test.py
      - name: Mobile Python 3.12 contract
        run: bash scripts/tests/mobile_sdk_python312_contract.sh
      - name: Apple workflow external lock handoff contract
        run: python3 -I -S -B scripts/tests/mobile_sdk_apple_lock_workflow_test.py
      - name: Swift native export retention contract
        run: python3 -I -S -B scripts/tests/swift_native_export_retention_test.py

  apple-mobile-sdk:
    needs: checker-self-test
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Resolve artifact version
        run: |
          input_version="${{ github.event.inputs.version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          echo "MOBILE_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
      - name: Require the canonical SDK release tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "tagged mobile SDK releases are owned by hyperledger-iroha/iroha" >&2
            exit 1
          }
          bridge_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          [[ "$GITHUB_REF_NAME" == "v${bridge_version}" ]] || {
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${bridge_version}" >&2
            exit 1
          }
      - name: Prepare external Apple build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-mobile-apple-artifacts"
          build_dir="$RUNNER_TEMP/iroha-mobile-apple-build"
          package_dir="$RUNNER_TEMP/iroha-mobile-sdk-package"
          swift_scratch_dir="$RUNNER_TEMP/iroha-mobile-swift-build"
          mkdir -p "$artifact_dir" "$build_dir" "$swift_scratch_dir"
          test ! -e "$package_dir"
          echo "MOBILE_SDK_APPLE_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_REQUIRE_EXTERNAL_APPLE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_OUT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "NORITO_BRIDGE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_PACKAGE_OUT_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_SWIFT_SCRATCH_DIR=$swift_scratch_dir" >> "$GITHUB_ENV"
      - name: Install Apple Rust targets
        run: |
          rustup_source="$(command -v rustup)"
          rustup_source="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_source")"
          [[ "$rustup_source" == /* && -f "$rustup_source" && ! -L "$rustup_source" && -x "$rustup_source" ]]
          rustup_tools="$RUNNER_TEMP/iroha-mobile-apple-tools"
          mkdir -p "$rustup_tools"
          chmod 0700 "$rustup_tools"
          rustup_path="$rustup_tools/rustup"
          test ! -e "$rustup_path"
          /bin/cp "$rustup_source" "$rustup_path"
          chmod 0700 "$rustup_path"
          rustup_path="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$rustup_path")"
          [[ "$rustup_path" == /* && "${rustup_path##*/}" == rustup && -f "$rustup_path" && ! -L "$rustup_path" && -x "$rustup_path" ]]
          echo "MOBILE_SDK_RUSTUP_BINARY=$rustup_path" >> "$GITHUB_ENV"
          "$rustup_path" target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
      - name: Bind the first-release Apple Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-mobile-apple-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustc)"
          rustdoc_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Materialize the authenticated external Apple Cargo lock
        shell: bash
        run: |
          umask 077
          source ci/privacy_sdk_cargo_lockfile.sh
          lock_dir="$RUNNER_TEMP/iroha-mobile-apple-lock"
          mkdir -m 0700 "$lock_dir"
          lock_dir="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$lock_dir")"
          release_lock="$lock_dir/Cargo.lock"
          workspace_lock_state="present:$(privacy_sdk_file_seal "$GITHUB_WORKSPACE/Cargo.lock" "$MOBILE_SDK_PYTHON_BINARY")"
          privacy_sdk_materialize_canonical_cargo_lock \
            "$GITHUB_WORKSPACE" "$release_lock" "$workspace_lock_state" \
            "$MOBILE_SDK_PYTHON_BINARY"
          release_lock="$(IROHA_PRIVACY_CARGO_LOCKFILE_PATH="$release_lock" \
            privacy_sdk_resolve_cargo_lockfile "$GITHUB_WORKSPACE" "$MOBILE_SDK_PYTHON_BINARY")"
          echo "IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH=$release_lock" >> "$GITHUB_ENV"
      - name: Build NoritoBridge XCFramework
        run: scripts/build_norito_xcframework.sh --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Validate Apple mobile SDK artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --apple-only --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH"
      - name: Test Swift SDK
        working-directory: IrohaSwift
        run: >-
          swift test
          --disable-automatic-resolution
          --scratch-path "$MOBILE_SDK_SWIFT_SCRATCH_DIR"
      - name: Package Apple mobile SDK artifact
        run: bash scripts/package_mobile_sdk_artifacts.sh --apple --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH" --version "$MOBILE_SDK_VERSION"
      - name: Execute packaged ZIP and public Swift SDK consumers in Release
        shell: bash
        run: |
          bridge_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          archive="$MOBILE_SDK_PACKAGE_OUT_DIR/NoritoBridge-v${bridge_version}.xcframework.zip"
          cargo_path="$("$MOBILE_SDK_RUSTUP_BINARY" which --toolchain 1.93.1 cargo)"
          developer_dir="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$(/usr/bin/xcode-select -p)")"
          env -i \
            HOME="$HOME" \
            PATH="${MOBILE_SDK_PYTHON_BINARY%/*}:${cargo_path%/*}:${RUSTC%/*}:${RUSTDOC%/*}:/usr/bin:/bin" \
            TMPDIR=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            NORITO_BRIDGE_SEAL_HOME="$HOME" \
            NORITO_BRIDGE_SEAL_CARGO_HOME="${MOBILE_SDK_CARGO_HOME:-$HOME/.cargo}" \
            NORITO_BRIDGE_SEAL_CARGO_INVOCATION_DIR="${MOBILE_SDK_CARGO_INVOCATION_DIR:-$GITHUB_WORKSPACE}" \
            NORITO_BRIDGE_SEAL_RUSTUP_HOME="$HOME/.rustup" \
            NORITO_BRIDGE_SEAL_TMPDIR=/tmp \
            NORITO_BRIDGE_SEAL_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            NORITO_BRIDGE_SEAL_CARGO="$cargo_path" \
            NORITO_BRIDGE_SEAL_RUSTC="$RUSTC" \
            NORITO_BRIDGE_SEAL_RUSTDOC="$RUSTDOC" \
            NORITO_BRIDGE_SEAL_RUSTUP="$MOBILE_SDK_RUSTUP_BINARY" \
            NORITO_BRIDGE_SEAL_DEVELOPER_DIR="$developer_dir" \
            "$MOBILE_SDK_PYTHON_BINARY" -I -S -B scripts/validate_norito_bridge_archive.py \
              --root "$GITHUB_WORKSPACE" \
              --archive "$archive" \
              --lockfile-path "$IROHA_PRIVACY_RELEASE_CARGO_LOCKFILE_PATH" \
              --scratch-dir "$NORITO_BRIDGE_BUILD_DIR" > "$RUNNER_TEMP/swift-release-archive-verification.json"
          archive_sha256="$("$MOBILE_SDK_PYTHON_BINARY" -I -S -B -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' \
            "$RUNNER_TEMP/swift-release-archive-verification.json")"
          "$MOBILE_SDK_PYTHON_BINARY" -I -S -B scripts/check_swift_release_consumers.py \
            --archive "$archive" \
            --archive-sha256 "$archive_sha256" \
            --sdk-path "$GITHUB_WORKSPACE/IrohaSwift" \
            --work-dir "$RUNNER_TEMP/iroha-swift-release-consumers" \
            --archive-scratch "$RUNNER_TEMP/norito-bridge-archive-consumer-build" \
            --sdk-scratch "$RUNNER_TEMP/iroha-swift-sdk-release-consumer-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-sdk-apple-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-sdk-package/*
          if-no-files-found: error
          retention-days: 14

  android-mobile-sdk:
    needs: checker-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      IROHA_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/target/debug
      IROHA_REQUIRE_SORAFS_NATIVE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind the canonical mobile Python
        shell: bash
        run: |
          mobile_python="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          [[ "$("$mobile_python" -I -S -B -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == "3.12" ]]
          echo "MOBILE_SDK_PYTHON_BINARY=$mobile_python" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
      - name: Resolve artifact version
        run: |
          input_version="${{ github.event.inputs.version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "$input_version" ]]; then
            version="$input_version"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          maven_version="${version#v}"
          echo "MOBILE_SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_MAVEN_VERSION=$maven_version" >> "$GITHUB_ENV"
      - name: Require the canonical SDK release tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "tagged mobile SDK releases are owned by hyperledger-iroha/iroha" >&2
            exit 1
          }
          bridge_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          [[ "$GITHUB_REF_NAME" == "v${bridge_version}" ]] || {
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${bridge_version}" >&2
            exit 1
          }
      - name: Install Android SDK and NDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set by the runner" >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Android Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo fetch --locked
      - name: Bind the first-release Android Cargo envelope
        run: |
          cargo_target="$RUNNER_TEMP/iroha-mobile-android-cargo"
          mkdir -p "$cargo_target"
          cargo_target="$(python3 -I -S -B -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$cargo_target")"
          rustc_path="$(rustup which --toolchain 1.93.1 rustc)"
          rustdoc_path="$(rustup which --toolchain 1.93.1 rustdoc)"
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"
          echo "IROHA_NATIVE_LIBRARY_PATH=$cargo_target/debug" >> "$GITHUB_ENV"
          echo "RUSTC=$rustc_path" >> "$GITHUB_ENV"
          echo "RUSTDOC=$rustdoc_path" >> "$GITHUB_ENV"
      - name: Prepare external Android build and artifact roots
        run: |
          artifact_dir="$RUNNER_TEMP/iroha-mobile-android-artifacts"
          gradle_home="$artifact_dir/gradle-user-home"
          project_cache="$artifact_dir/project-cache"
          gradle_tmp="$artifact_dir/tmp"
          java_sorafs_tmp="$gradle_tmp/java-sorafs"
          maven_repo="$artifact_dir/maven"
          package_dir="$RUNNER_TEMP/iroha-mobile-sdk-package"
          mkdir -p "$artifact_dir" "$gradle_home" "$project_cache" "$gradle_tmp" "$java_sorafs_tmp" "$maven_repo"
          test ! -e "$package_dir"
          echo "MOBILE_SDK_ANDROID_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_MAVEN_REPO_DIR=$maven_repo" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR=$project_cache" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_ANDROID_GRADLE_TMP_DIR=$gradle_tmp" >> "$GITHUB_ENV"
          echo "MOBILE_SDK_PACKAGE_OUT_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
      - name: Build host SoraFS reference native bridge
        run: |
          set -euo pipefail
          cargo build --locked -p connect_norito_bridge --lib --features privacy-production-enabled
          cargo build --locked -p kotlin-fixture-gen --features dev-tools --bin kotlin-fixture-gen
          fixture_generator="$CARGO_TARGET_DIR/debug/kotlin-fixture-gen"
          [[ -f "$fixture_generator" && ! -L "$fixture_generator" && -x "$fixture_generator" ]]
          echo "IROHA_KOTLIN_FIXTURE_GEN_BIN=$fixture_generator" >> "$GITHUB_ENV"
      - name: Make reviewed Iroha source read-only
        run: chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Build Android native bridge libraries
        working-directory: kotlin
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR"
          -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR"
          -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon"
          :client-android:buildNativeLibs
      - name: Test, lint, publish, and build Android SDK artifacts
        working-directory: kotlin
        run: |
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR" \
            -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR" \
            -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon" \
            -PirohaSdkVersion="$MOBILE_SDK_MAVEN_VERSION" \
            -PirohaSdkRepoDir="$MOBILE_SDK_ANDROID_MAVEN_REPO_DIR" \
            :core-jvm:test \
            :tools:test \
            :client-android:testDebugUnitTest \
            :client-android:testDebugHostNative \
            :client-android:lintRelease \
            :kagemusha-wallet-android:testDebugUnitTest \
            :kagemusha-wallet-android:testDebugHostNative \
            :kagemusha-wallet-android:lintRelease \
            :core-jvm:cyclonedxDirectBom \
            :client-android:cyclonedxDirectBom \
            :kagemusha-wallet-android:cyclonedxDirectBom \
            :core-jvm:publishReleasePublicationToMavenLocal \
            :client-android:publishReleasePublicationToMavenLocal \
            :kagemusha-wallet-android:publishReleasePublicationToMavenLocal \
            :core-jvm:publishReleasePublicationToMobileSdkRepository \
            :client-android:publishReleasePublicationToMobileSdkRepository \
            :kagemusha-wallet-android:publishReleasePublicationToMobileSdkRepository
      - name: Collect canonical Kotlin runtime SBOMs
        run: >-
          "$MOBILE_SDK_PYTHON_BINARY" -I -S -B scripts/mobile_sdk_android_artifacts.py
          --root "$GITHUB_WORKSPACE"
          --collect-sboms "$MOBILE_SDK_ANDROID_ARTIFACT_DIR/sbom"
          --version "$MOBILE_SDK_MAVEN_VERSION"
      - name: Retain canonical Kotlin runtime inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-runtime-sbom-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-android-artifacts/sbom/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Test mirrored Java Android Governance DAG reference validators
        working-directory: java/iroha_android
        env:
          ANDROID_HARNESS_MAINS: org.hyperledger.iroha.android.sorafs.SorafsReferenceValidatorsTests
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --project-cache-dir "$MOBILE_SDK_ANDROID_PROJECT_CACHE_DIR/java-sorafs" \
            -Djava.io.tmpdir="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/java-sorafs" \
            -Dkotlin.daemon.runFilesPath="$MOBILE_SDK_ANDROID_GRADLE_TMP_DIR/kotlin-daemon-java-sorafs" \
            -PenableCycloneDx=false \
            :core:test \
            --tests org.hyperledger.iroha.android.GradleHarnessTests \
            :android:assembleRelease \
            --console=plain
      - name: Reject JVM transports in the Java Android release AAR
        env:
          ANDROID_TRANSPORT_GUARD_AAR: ${{ runner.temp }}/iroha-mobile-android-artifacts/gradle-build/iroha-android/android/outputs/aar/android-release.aar
        run: bash ci/check_android_transport_guard.sh
      - name: Validate Android mobile SDK artifact
        run: bash scripts/check_mobile_sdk_artifacts.sh --android-only --require-built-android
      - name: Package Android mobile SDK artifact
        run: bash scripts/package_mobile_sdk_artifacts.sh --android --version "$MOBILE_SDK_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-sdk-android-${{ env.MOBILE_SDK_VERSION }}
          path: ${{ runner.temp }}/iroha-mobile-sdk-package/*
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    if: >-
      github.ref_type == 'tag' &&
      github.repository == 'hyperledger-iroha/iroha'
    needs: [apple-mobile-sdk, android-mobile-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mobile-sdk-*
          path: release-assets
          merge-multiple: true
      - name: Publish mobile SDK release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "hyperledger-iroha/iroha" ]] || {
            echo "release publication is restricted to hyperledger-iroha/iroha" >&2
            exit 1
          }
          bridge_version="$(python3 -I -S -B - <<'PY'
          from pathlib import Path
          import re
          raw = Path("IrohaSwift/VERSION").read_bytes()
          match = re.fullmatch(rb"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n", raw)
          if match is None:
              raise SystemExit("IrohaSwift/VERSION must be one canonical ASCII SemVer plus newline")
          print(raw[:-1].decode("ascii"))
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "v${bridge_version}" ]]; then
            echo "release tag $GITHUB_REF_NAME must equal canonical SDK tag v${bridge_version}" >&2
            exit 1
          fi
          candidate_inventory="$(
            find release-assets -maxdepth 1 -type f -print | sort |
              while IFS= read -r candidate; do
                printf '%s %s\n' "${candidate##*/}" "$(wc -c <"$candidate" | tr -d '[:space:]')"
              done
          )"
          [[ -n "$candidate_inventory" ]] || {
            echo "release asset inventory is empty" >&2
            exit 1
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" == "true" ]] || {
              echo "existing release is public; refusing mutation" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Mobile SDK artifacts for $GITHUB_REF_NAME"
          fi
          existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          [[ -z "$existing_assets" ]] || {
            echo "draft release already contains assets; refusing partial upload" >&2
            exit 1
          }
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          remote_inventory="$(
            gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[] | "\(.name) \(.size)"' | sort
          )"
          [[ "$remote_inventory" == "$candidate_inventory" ]] || {
            echo "uploaded release asset inventory is incomplete" >&2
            exit 1
          }
          verify_dir="$(mktemp -d "$RUNNER_TEMP/mobile-sdk-release-verify.XXXXXXXX")"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$verify_dir"
          while IFS= read -r candidate; do
            candidate_name="${candidate##*/}"
            [[ "$(sha256sum "$candidate" | cut -d' ' -f1)" == "$(sha256sum "$verify_dir/$candidate_name" | cut -d' ' -f1)" ]] || {
              echo "downloaded release asset digest mismatch: $candidate_name" >&2
              exit 1
            }
          done < <(find release-assets -maxdepth 1 -type f -print | sort)
          gh release edit "$GITHUB_REF_NAME" --draft=false
