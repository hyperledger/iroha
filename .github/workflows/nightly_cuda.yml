name: Nightly CUDA Hardware

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GPUZSTD_CUDA_ARCH: -arch=sm_86
  JSONSTAGE1_CUDA_ARCH: -arch=sm_86
  GPUZSTD_CUDA_REQUIRE: "1"
  JSONSTAGE1_CUDA_REQUIRE: "1"
  NORITO_CRC64_CUDA_REQUIRE: "1"
  FASTPQ_CUDA_REQUIRE: "1"
  CARGO_TARGET_DIR: target/cuda-nightly
  RUST_TEST_THREADS: "1"

jobs:
  cuda-driverless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "."
      - name: CUDA driver boundary without toolkit or driver
        run: |
          set -o pipefail
          mkdir -p dist/cuda-driverless
          cargo test --locked -p cust_raw -- --include-ignored \
            2>&1 | tee dist/cuda-driverless/driver-tests.log
          python3 - <<'PY'
          import pathlib
          import subprocess
          target = pathlib.Path("target/cuda-nightly/debug/deps")
          binaries = [path for path in target.glob("driver_absent-*") if path.is_file() and path.suffix == ""]
          assert binaries, "driverless qualification executable is missing"
          reports = []
          for binary in binaries:
              linked = subprocess.check_output(["ldd", str(binary)], text=True)
              assert "libcuda" not in linked and "nvcuda" not in linked, linked
              print(binary, linked)
              reports.append(f"{binary}\n{linked}")
          pathlib.Path("dist/cuda-driverless/native-links.txt").write_text("\n".join(reports))
          PY
      - name: Upload driverless qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cuda-driverless
          path: dist/cuda-driverless
          retention-days: 14
  cuda-hardware:
    runs-on: [self-hosted, Linux, cuda]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: "true"
          workspaces: "."
      - name: Capture CUDA host inventory
        run: |
          mkdir -p dist/cuda-nightly
          {
            echo "# CUDA Nightly Hardware"
            echo
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- GPUZSTD_CUDA_ARCH: ${GPUZSTD_CUDA_ARCH}"
            echo "- JSONSTAGE1_CUDA_ARCH: ${JSONSTAGE1_CUDA_ARCH}"
            echo "- NORITO_CRC64_CUDA_REQUIRE: ${NORITO_CRC64_CUDA_REQUIRE}"
            echo
            echo "## nvidia-smi"
            nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv,noheader || true
            echo
            echo "## nvcc"
            nvcc --version || true
          } | tee dist/cuda-nightly/hardware.md
          cat dist/cuda-nightly/hardware.md >> "$GITHUB_STEP_SUMMARY"
      - name: IVM required source-owned CUDA hardware qualification
        run: |
          set -o pipefail
          cargo test --locked -p ivm --test cuda_hardware --features cuda-hardware-tests -- --nocapture \
            2>&1 | tee dist/cuda-nightly/ivm-source-owned-hardware.log
          cargo test --locked -p ivm --lib cuda_ --features cuda -- --nocapture
          cargo test --locked -p ivm --test ivm_group_02 cuda --features cuda -- --nocapture
          cargo test --locked -p ivm --test ivm_group_07 poseidon_cuda --features cuda -- --nocapture
      - name: FASTPQ CUDA tests
        run: cargo test -p fastpq_prover --lib --features fastpq-gpu cuda -- --nocapture
      - name: Norito CUDA zstd helper and loader tests
        run: |
          cargo test -p gpuzstd_cuda --features cuda-kernel -- --nocapture
          cargo build -p gpuzstd_cuda --features cuda-kernel
          cargo test -p norito gpu_zstd --features gpu-compression -- --nocapture
          cargo test -p norito required_cuda_backend_is_registered_when_requested --features gpu-compression -- --nocapture
      - name: Norito JSON Stage-1 CUDA helper and loader tests
        run: |
          cargo test -p jsonstage1_cuda --features cuda-kernel -- --nocapture
          cargo build -p jsonstage1_cuda --features cuda-kernel
          cargo test -p norito sequence_plan --features codec-gpu-cuda -- --nocapture
          cargo test -p norito crc64 --features cuda-crc64 -- --nocapture
          cargo test -p norito stage1_helper --features cuda-stage1,stage1-validate -- --nocapture
          cargo test -p norito cuda_stage1_backend_matches_scalar_when_required_or_available --features cuda-stage1,stage1-validate -- --nocapture
      - name: Kotlin and Java CUDA JNI hardware qualification
        run: |
          cargo build --locked -p connect_norito_bridge --features cuda
          export IROHA_NATIVE_LIBRARY_PATH="$GITHUB_WORKSPACE/$CARGO_TARGET_DIR/debug"
          test -f "$IROHA_NATIVE_LIBRARY_PATH/libconnect_norito_bridge.so"
          sha256sum "$IROHA_NATIVE_LIBRARY_PATH/libconnect_norito_bridge.so" \
            | tee dist/cuda-nightly/kotlin-bridge.sha256
          cd kotlin
          ./gradlew :core-jvm:cudaHardwareTest --console=plain
      - name: IVM checked-in PTX identity and bundled hardware qualification
        env:
          CUDA_APPROVED_IMAGE: ${{ vars.IVM_CUDA_QUALIFICATION_IMAGE }}
          CUDA_REVIEWED_IMAGE_SHA256: ${{ vars.IVM_CUDA_IMAGE_SHA256 }}
          CUDA_PINNED_NVCC: ${{ vars.IVM_CUDA_REPRODUCTION_NVCC_PATH }}
          CUDA_PINNED_OPENSSL: ${{ vars.IVM_CUDA_REPRODUCTION_OPENSSL_PATH }}
          CUDA_SIGNING_KEY: ${{ vars.IVM_CUDA_REPRODUCTION_SIGNING_KEY_PATH }}
        run: |
          set -o pipefail
          # None and missing authentic inputs fail; no producer receipt supplies approval.
          # The sole offline producer uses explicit pinned tools and a runtime-only
          # external key. Its candidate is compared, never installed or self-approved.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.check_ivm_cuda_release_image import configured_image
          from scripts.release_artifact_contract import require_release_cuda_source_inputs
          require_release_cuda_source_inputs(Path.cwd(), 'x86_64-unknown-linux-gnu')
          configured_image(os.environ['CUDA_APPROVED_IMAGE'], os.environ['CUDA_REVIEWED_IMAGE_SHA256'])
          PY
          docker pull "$CUDA_APPROVED_IMAGE"
          docker image inspect --format '{{json .}}' "$CUDA_APPROVED_IMAGE" \
            > dist/cuda-nightly/image-inspection.json
          python3 scripts/check_ivm_cuda_release_image.py \
            --image-reference "$CUDA_APPROVED_IMAGE" \
            --image-sha256 "$CUDA_REVIEWED_IMAGE_SHA256" \
            --inspection dist/cuda-nightly/image-inspection.json \
            --bundle-dir crates/ivm/cuda \
            --output dist/cuda-nightly/image-binding.json
          image_id="$(python3 -c 'import json; print(json.load(open("dist/cuda-nightly/image-binding.json"))["image_config_digest"])')"
          docker run --rm --gpus all --entrypoint /bin/bash \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
            --workdir /workspace \
            --mount "type=bind,source=${CUDA_SIGNING_KEY},target=/run/ivm-cuda-reproduction/key.pem,readonly" \
            --env "CUDA_PINNED_NVCC=${CUDA_PINNED_NVCC}" \
            --env "CUDA_PINNED_OPENSSL=${CUDA_PINNED_OPENSSL}" \
            --env "CUDA_REVIEWED_IMAGE_SHA256=${CUDA_REVIEWED_IMAGE_SHA256}" \
            --env CARGO_TARGET_DIR=target/cuda-bundled-release \
            --env CARGO_TERM_COLOR=always --env RUST_TEST_THREADS=1 \
            "$image_id" -euc '
              set -o pipefail
              python3 scripts/build_ivm_cuda_bundle.py \
                --nvcc "$CUDA_PINNED_NVCC" --openssl "$CUDA_PINNED_OPENSSL" \
                --signing-key /run/ivm-cuda-reproduction/key.pem \
                --cuda-image-sha256 "$CUDA_REVIEWED_IMAGE_SHA256" \
                --output-dir /workspace/target/ivm-cuda-reproduction
              for input in crates/ivm/cuda/*.ptx crates/ivm/cuda/provenance.v1; do
                cmp "$input" "target/ivm-cuda-reproduction/$(basename "$input")"
              done
              cargo build --locked -p ivm --features cuda \
                2>&1 | tee dist/cuda-nightly/ivm-ptx-identity.log
              sha256sum crates/ivm/cuda/*.cu crates/ivm/cuda/*.ptx \
                > dist/cuda-nightly/ivm-ptx.sha256
              cargo test --locked -p ivm --test cuda_hardware \
                --features cuda-hardware-tests -- --nocapture \
                2>&1 | tee dist/cuda-nightly/ivm-bundled-hardware.log
            '
          python3 - <<'PY'
          import hashlib, json, pathlib
          receipt = json.loads(pathlib.Path('dist/cuda-nightly/image-binding.json').read_bytes())
          actual = hashlib.sha256(pathlib.Path('crates/ivm/cuda/provenance.v1').read_bytes()).hexdigest()
          assert actual == receipt['source_manifest_sha256'], 'CUDA source manifest changed during qualification'
          PY
      - name: Upload CUDA inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cuda-nightly-hardware
          path: |
            dist/cuda-nightly
            kotlin/core-jvm/build/reports/tests/cudaHardwareTest
            kotlin/core-jvm/build/test-results/cudaHardwareTest
          retention-days: 14
