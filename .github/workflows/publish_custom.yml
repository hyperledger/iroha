name: Publish (custom)

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: "Type of the image to build"
        required: true
        type: choice
        options:
          - profiling
          - glibc
          - alpine
        default: glibc
      checkout_ref:
        description: "The branch, tag or SHA to checkout"
        required: true
        type: string
        default: main

env:
  IROHA_CI_IMAGE: ${{ vars.IROHA_CI_IMAGE }}
  IROHA_RUST_BUILDER_IMAGE: ${{ vars.IROHA_RUST_BUILDER_IMAGE }}
  IROHA_RUNTIME_IMAGE: ${{ vars.IROHA_RUNTIME_IMAGE }}
  IROHA_MUSL_BUILDER_IMAGE: ${{ vars.IROHA_MUSL_BUILDER_IMAGE }}
  IROHA_MUSL_RUNTIME_IMAGE: ${{ vars.IROHA_MUSL_RUNTIME_IMAGE }}

jobs:
  release-feature-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.checkout_ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - name: Enforce reviewed shipping feature graphs
        run: python3 -I -S scripts/check_release_feature_graph.py

  image:
    needs: release-feature-graph
    runs-on: [self-hosted, Linux, iroha2]
    container:
      image: ${{ vars.IROHA_CI_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.checkout_ref }}
      - name: Validate digest-pinned Docker base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_RUST_BUILDER_IMAGE" \
            --runtime "$IROHA_RUNTIME_IMAGE"
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CI_IMAGE" \
            --runtime "$IROHA_CI_IMAGE"
      - name: Validate digest-pinned musl base images
        if: ${{ inputs.image_type == 'alpine' }}
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_MUSL_BUILDER_IMAGE" \
            --runtime "$IROHA_MUSL_RUNTIME_IMAGE"
      - name: Resolve checkout metadata
        id: checkout_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if git_tag="$(git describe --tags --exact-match 2>/dev/null)"; then
            echo "tag=$git_tag" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Soramitsu Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.soramitsu.co.jp
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        if: always()
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.34.1
          install: true

      # glibc
      - name: Build and push iroha:glibc image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: ${{ inputs.image_type == 'glibc' }}
        with:
          push: true
          tags: docker.soramitsu.co.jp/iroha3/iroha:glibc-${{ steps.checkout_meta.outputs.sha }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
          context: .

      # Profiling
      - name: Get the release tag
        if: ${{ inputs.image_type == 'profiling' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ steps.checkout_meta.outputs.tag }}"
          if [[ -z "$RELEASE_VERSION" ]]; then
            RELEASE_VERSION="${{ github.event.inputs.checkout_ref }}"
          fi
          RELEASE_VERSION="${RELEASE_VERSION#refs/tags/}"
          PREFIX='v'
          TAG=${RELEASE_VERSION#$PREFIX}
          echo "TAG=$TAG" >>$GITHUB_ENV
      - name: Build and push iroha:profiling-tag-sha image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: ${{ inputs.image_type == 'profiling' }}
        with:
          push: true
          tags: docker.soramitsu.co.jp/iroha3/iroha:profiling-${{ env.TAG }}-${{ steps.checkout_meta.outputs.sha }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          build-args: |
            "IROHA_RUST_BUILDER_IMAGE=${{ env.IROHA_RUST_BUILDER_IMAGE }}"
            "IROHA_RUNTIME_IMAGE=${{ env.IROHA_RUNTIME_IMAGE }}"
            "PROFILE=profiling"
            "RUSTFLAGS=-C force-frame-pointers=on"
            "FEATURES=profiling"
            "CARGOFLAGS=-Z build-std"
          context: .

      # Alpine (difference from glibc is the use of Dockerfile.musl)
      - name: Build and push iroha:alpine-sha image
        if: ${{ inputs.image_type == 'alpine' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: true
          tags: docker.soramitsu.co.jp/iroha3/iroha:alpine-${{ steps.checkout_meta.outputs.sha }}
          labels: commit=${{ steps.checkout_meta.outputs.sha }}
          file: Dockerfile.musl
          build-args: |
            "IROHA_MUSL_BUILDER_IMAGE=${{ env.IROHA_MUSL_BUILDER_IMAGE }}"
            "IROHA_MUSL_RUNTIME_IMAGE=${{ env.IROHA_MUSL_RUNTIME_IMAGE }}"
          context: .
