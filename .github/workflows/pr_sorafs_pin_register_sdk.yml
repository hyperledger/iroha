          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-torii-retired-manifest-b64
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-torii-retired-summary-field
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-torii-manifest-bound
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-torii-canonical-decode
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-torii-retired-helper
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-python-fee-payment-field
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-swift-contract-test
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-swift-retired-request-field
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-csharp-malformed-response-test
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-kotlin-builder-test
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-kotlin-successor-digest-test
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-java-builder-test
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-java-successor-digest-test
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-js-submitted-epoch-type
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-kotlin-submitted-epoch-model
          bash ci/check_sorafs_pin_register_sdk_guard.sh --negative-control-java-submitted-epoch-model
      - name: Reject tracked Python bytecode
        run: bash ci/check_no_tracked_python_bytecode.sh
      - name: SoraFS pin-register SDK guard
        run: bash ci/check_sorafs_pin_register_sdk_guard.sh
