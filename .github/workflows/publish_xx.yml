name: Publish (Experimental Multi-Platform)

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: "Type of the image to build"
        required: true
        type: choice
        options:
          - xx
          - xx-profiling
        default: xx
      checkout_ref:
        description: "The branch, tag or SHA to checkout"
        required: true
        type: string
        default: main

env:
  TAG_BASE: experimental-xx
  IROHA_CROSS_XX_IMAGE: ${{ vars.IROHA_CROSS_XX_IMAGE }}
  IROHA_CROSS_RUST_IMAGE: ${{ vars.IROHA_CROSS_RUST_IMAGE }}
  IROHA_CROSS_RUNTIME_IMAGE: ${{ vars.IROHA_CROSS_RUNTIME_IMAGE }}

jobs:
  release-feature-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.93.1
      - name: Enforce reviewed shipping feature graphs
        run: python3 -I -S scripts/check_release_feature_graph.py

  image:
    needs: release-feature-graph
    runs-on: [self-hosted, Linux, iroha2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate digest-pinned cross-build base images
        run: |
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CROSS_XX_IMAGE" \
            --runtime "$IROHA_CROSS_RUNTIME_IMAGE"
          python3 scripts/validate_release_image_bases.py \
            --builder "$IROHA_CROSS_RUST_IMAGE" \
            --runtime "$IROHA_CROSS_RUNTIME_IMAGE"
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        if: always()
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.34.1
          install: true

      - name: Build and push default image
        if: ${{ inputs.image_type == 'xx' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: true
          file: Dockerfile.cross
          platforms: linux/amd64,linux/arm64
          tags: |
            hyperledger/iroha:${{ env.TAG_BASE }}-${{ github.sha }}
          labels: commit=${{ github.sha }}
          build-args: |
            "IROHA_CROSS_XX_IMAGE=${{ env.IROHA_CROSS_XX_IMAGE }}"
            "IROHA_CROSS_RUST_IMAGE=${{ env.IROHA_CROSS_RUST_IMAGE }}"
            "IROHA_CROSS_RUNTIME_IMAGE=${{ env.IROHA_CROSS_RUNTIME_IMAGE }}"
          context: .

      - name: Build and push profiling image
        if: ${{ inputs.image_type == 'xx-profiling' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: true
          file: Dockerfile.cross
          platforms: linux/amd64,linux/arm64
          tags: |
            hyperledger/iroha:${{ env.TAG_BASE }}-profiling-${{ github.sha }}
          labels: commit=${{ github.sha }}
          build-args: |
            "IROHA_CROSS_XX_IMAGE=${{ env.IROHA_CROSS_XX_IMAGE }}"
            "IROHA_CROSS_RUST_IMAGE=${{ env.IROHA_CROSS_RUST_IMAGE }}"
            "IROHA_CROSS_RUNTIME_IMAGE=${{ env.IROHA_CROSS_RUNTIME_IMAGE }}"
            "PROFILE=profiling"
            "RUSTFLAGS=-C force-frame-pointers=on"
            "FEATURES=profiling"
            "CARGOFLAGS=-Z build-std"
          context: .
