[package]
name = "parliament_qualification_bridge"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
crate-type = ["staticlib"]
[features]
default = []
accel = ["iroha_parliament_ballot_proof/accel", "iroha_zkp_vole/accel"]
[dependencies]
iroha_parliament_ballot_proof = { path = "@IROHA_REPO@/crates/iroha_parliament_ballot_proof" }
iroha_zkp_vole = { path = "@IROHA_REPO@/crates/iroha_zkp_vole" }
norito = { path = "@IROHA_REPO@/crates/norito", default-features = false, features = ["json"] }
[dev-dependencies]
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }
[patch.crates-io]
aes = { path = "@IROHA_REPO@/vendor/aes" }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
