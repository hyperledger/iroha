name: ParliamentQualification
options:
  bundleIdPrefix: org.iroha.experimental
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: "@DEVELOPMENT_TEAM@"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ONLY_ACTIVE_ARCH: YES
    ARCHS: arm64
    SDKROOT: iphoneos
targets:
  ParliamentQualification:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.iroha.experimental.parliament-b6
        PRODUCT_NAME: ParliamentQualification
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parliament B6
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-L$(PROJECT_DIR)/lib", "-lparliament_qualification_bridge", "-framework", "Security", "-framework", "SystemConfiguration", "-lc++"]
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
schemes:
  ParliamentQualification:
    build:
      targets:
        ParliamentQualification: all
    run:
      config: Release
