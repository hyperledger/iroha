[torii.faucet]
enabled = true
authority = "REPLACE_WITH_TAIRA_FAUCET_AUTHORITY"
private_key_file = "REPLACE_WITH_TAIRA_FAUCET_PRIVATE_KEY_FILE"
asset_definition_id = "xor#universal"
amount = "25000"
pow_difficulty_bits = 4
pow_scrypt_log_n = 13
pow_scrypt_r = 8
pow_scrypt_p = 1
# Adaptive difficulty (specs/sccp.md §4.14.5 item 1). Torii counts the claims in
# the 64 blocks ending at the claimant-chosen anchor, so the anchor age must stay
# far below the lookback: a claimant pins the oldest accepted anchor, and only
# its claims older than 6 blocks are counted. Every 2 counted claims add one bit,
# up to 8 extra bits (12 total). An occasional claim costs 2^4 scrypt
# evaluations; the cheapest burst of the 40 claims of one citizenship bond costs
# 81 984 evaluations instead of 640. A solver must submit within 6 committed
# blocks of its anchor (about 24 s while blocks come at the 4 s target, longer on
# a quieter chain), or re-fetch the puzzle; see README.md "SORA Parliament
# seating".
# TODO(ws55): Torii (`faucet_pow_recent_claims`) should count adaptive claims up
# to the current committed height, not up to the claimant-chosen anchor.
pow_max_anchor_age_blocks = 6
pow_adaptive_lookback_blocks = 64
pow_adaptive_claims_per_extra_bit = 2
pow_adaptive_max_extra_bits = 8
# Fresh testnet generations have no finalized global threshold-beacon pulse
# yet; keep the anchor-hash+scrypt faucet usable from genesis.
pow_beacon_seed_enabled = false

