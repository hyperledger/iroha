# Generated by scripts/render_taira_edge_nginx_conf.py from the Taira validator roster.
# Shared-edge stress runs require the main nginx.conf to set:
#   worker_rlimit_nofile 65536;
#   events { worker_connections 16384; }
# Deploy on the shared edge host serving:
# - taira.sora.org (Torii endpoint / convenience host)
# - taira-explorer.sora.org (Explorer web UI)
# - validator-specific public Torii hostnames from the roster
# - *.sorafs.taira.sora.org (origin-isolated SoraFS site hosts)
# - <alias>.mon.taira.sora.net (public Soracloud browser gateway hosts)

map $host $taira_mon_alias_host {
  default "";
  ~^(?<taira_mon_alias_host_capture>.+)\.mon\.taira\.sora\.net$ $taira_mon_alias_host_capture;
}

map $http_origin $taira_public_torii_cors_origin {
  default "";
  "http://127.0.0.1:3000" $http_origin;
  "http://localhost:3000" $http_origin;
  "https://taira-explorer.sora.org" $http_origin;
  "https://test.soraswap.org" $http_origin;
  "https://dweb.link" $http_origin;
  "https://ipfs.io" $http_origin;
  "https://cloudflare-ipfs.com" $http_origin;
  "https://w3s.link" $http_origin;
  "https://nftstorage.link" $http_origin;
  "https://bokolo.soramitsu.io" $http_origin;
  "https://cbsi-banking.soramitsu.io" $http_origin;
  "https://cbsi-core.soramitsu.io" $http_origin;
  "https://bokolo-pob.soramitsu.io" $http_origin;
  "https://bokolo-bred.soramitsu.io" $http_origin;
  "https://bokolo-anz.soramitsu.io" $http_origin;
  "https://bokolo-bsp.soramitsu.io" $http_origin;
  "https://bokolo-m-selen.soramitsu.io" $http_origin;
  "https://bokolo-ezipei.soramitsu.io" $http_origin;
  "https://bpng.soramitsu.io" $http_origin;
  "https://mibank.soramitsu.io" $http_origin;
  "https://explorer-bpng.soramitsu.io" $http_origin;
  "https://bokolo-explorer.soramitsu.io" $http_origin;
}

upstream taira_validator_1_upstream {
  server 127.0.0.1:29080;
  keepalive 64;
}

upstream taira_validator_2_upstream {
  server 127.0.0.1:29081;
  keepalive 64;
}

upstream taira_validator_3_upstream {
  server 127.0.0.1:29082;
  keepalive 64;
}

upstream taira_validator_4_upstream {
  server 127.0.0.1:29083;
  keepalive 64;
}

upstream taira_public_edge_upstream {
  server 127.0.0.1:29080 max_fails=1 fail_timeout=5s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name taira.sora.org taira-explorer.sora.org mon.taira.sora.net taira-validator-1.sora.org taira-validator-2.sora.org taira-validator-3.sora.org taira-validator-4.sora.org *.sorafs.taira.sora.org ~^.+\.mon\.taira\.sora\.net$;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name taira.sora.org;
  client_max_body_size 1g;
  # Stream signed transaction bodies without nginx temporary files.
  proxy_request_buffering off;

  ssl_certificate /etc/letsencrypt/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taira.sora.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Expose-Headers;
  proxy_hide_header Access-Control-Max-Age;
  add_header Access-Control-Allow-Origin $taira_public_torii_cors_origin always;
  add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "accept, authorization, content-type, idempotency-key, x-client-app, x-request-id, x-account-id, x-correlation-id, mcp-method, mcp-name, mcp-protocol-version, x-api-token, x-iroha-onboarding-token, x-iroha-account, x-iroha-signature, x-iroha-timestamp-ms, x-iroha-nonce, x-iroha-witness" always;
  add_header Access-Control-Expose-Headers "etag, location, retry-after" always;
  add_header Access-Control-Max-Age "3600" always;
  add_header Vary "Origin" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  # IrohaConnect session tokens and MCP Connect tools are node-local; keep
  # session creation, management/aggregate status, and websocket authorization on one Torii process.
  location = /v1/connect/session {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/connect/session/ {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/status {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/status/aggregate {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/connect/ws {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location = /v1/mcp {
    proxy_pass http://taira_validator_1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/app-api/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/storage/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/pin/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /v1/sorafs/cid/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ /sorafs/cid/ {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }

  location ^~ / {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mon.taira.sora.net;
  client_max_body_size 1g;

  ssl_certificate /etc/letsencrypt/live/mon.taira.sora.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mon.taira.sora.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location = /health {
    default_type "text/plain";
    return 200 "Healthy\n";
  }

  location = / {
    default_type "text/plain";
    return 200 "Taira Soracloud Mon gateway\n\nUse https://<alias>.mon.taira.sora.net/<path> for browser clients.\nExample: https://solswap-indexer.sora.mon.taira.sora.net/api/indexer/v1/health\n";
  }

}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name *.mon.taira.sora.net ~^.+\.mon\.taira\.sora\.net$;
  client_max_body_size 1g;

  # Each pretty host receives an exact certificate at Soracloud alias bind time.
  # Do not use a wildcard certificate here: `*.mon.taira.sora.net` does not
  # cover multi-label aliases such as solswap-indexer.sora.mon.taira.sora.net.
  ssl_certificate /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location ^~ / {
    proxy_pass http://taira_public_edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $taira_mon_alias_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
  }
}

