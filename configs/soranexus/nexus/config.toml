[network]
address = "addr:0.0.0.0:1337#BF18"
public_address = "addr:nexus.mof2.sora.org:1337#D017"

[torii]
address = "addr:0.0.0.0:8080#B922"

# The public plugin contract includes ordinary write/submission tools so an
# explicitly authorized client can submit signed envelopes. Operator routes
# remain hidden; clients default to read-only behavior on Minamoto.
[torii.mcp]
enabled = true
profile = "writer"
expose_operator_routes = false
allow_tool_prefixes = ["iroha."]

[genesis]
public_key = "ed01204164BF554923ECE1FD412D241036D863A6AE430476C898248B8237D77534CFC4"
expected_hash_file = "/run/iroha/genesis.expected_hash"

[streaming]
identity_public_key = "ed01201C61FAF8FE94E253B93114240394F79A607B7FA55F9E5A41EBEC74B88055768B"
identity_private_key_file = "/run/secrets/iroha/nexus-streaming-identity-private-key"
feature_bits = 0b11

[nexus]
lane_count = 3

[nexus.fees]
fee_asset_id = "xor#universal"
sponsor_vault_custody_account_id = "sorauﾛ1NｱｻｸYSafﾇｷヰc5ﾇﾄVxﾏ9jLZヱﾋzsKqurﾊﾘ9ｸ3eｴAｶD54TDT"

[nexus.staking]
stake_asset_id = "xor#universal"

# Lanes are logical execution queues; they do not define server topology.
[[nexus.lane_catalog]]
index = 0
alias = "core"
description = "Primary execution lane"
dataspace = "universal"

[[nexus.lane_catalog]]
index = 1
alias = "governance"
description = "Governance & parliament traffic"
dataspace = "universal"

[[nexus.lane_catalog]]
index = 2
alias = "zk"
description = "Zero-knowledge attachments"
dataspace = "universal"

# Dataspaces are physical validator/storage boundaries. Minamoto currently
# deploys one such topology, shared by all logical lanes.
[[nexus.dataspace_catalog]]
alias = "universal"
id = 0
description = "Shared public data space for core, governance, and zero-knowledge lanes"

[nexus.routing_policy]
default_lane = 0
default_dataspace = "universal"

[[nexus.routing_policy.rules]]
lane = 1
dataspace = "universal"
matcher.instruction = "governance"
matcher.description = "Route governance instructions to the governance lane in the universal data space"

[[nexus.routing_policy.rules]]
lane = 2
dataspace = "universal"
matcher.instruction = "smartcontract::deploy"
matcher.description = "Route contract deployments to the zk lane in the universal data space"
