# Sora Nexus / Minamoto mainnet validator configuration
# Network and deployment overrides; omitted values use iroha_config defaults.
# Public network profile: `minamoto` (legacy deployment directory: `nexus`)
# Operators must provision the referenced runtime secrets, expected genesis hash,
# trusted-peer roster, and final signed genesis/topology before starting a validator.
# Start with: `iroha3d --sora --config configs/soranexus/nexus/config.toml`

chain = "00000000-0000-0000-0000-000000000753"
chain_discriminant = 753
public_key = "ea01309060D021340617E9554CCBC2CF3CC3DB922A9BA323ABDF7C271FCC6EF69BE7A8DEBCA7D9E96C0F0089ABA22CDAADE4A2"
