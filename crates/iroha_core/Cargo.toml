[[test]]
name = "kaigi_privacy"
path = "tests/kaigi_privacy.rs"
required-features = ["zk-tests"]

# Grouped integration-test harnesses keep `cargo test` from linking one binary per tests/*.rs file.

# SCCP v1 core public-boundary tests (`specs/sccp.md` §4).
[[test]]
name = "sccp_public_boundary"
path = "tests/sccp_public_boundary.rs"

# Certified dynamic private-dataspace registration and native execution through public APIs.
[[test]]
name = "private_dataspace_runtime"
path = "tests/private_dataspace_runtime.rs"
required-features = ["iroha-core-tests"]

[[test]]
name = "iroha_core_group_01"
