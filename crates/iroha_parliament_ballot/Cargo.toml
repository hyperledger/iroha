[package]
name = "iroha_parliament_ballot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed protocol layer of the Parliament anonymous ballot: canonical proof inputs, authenticated contexts, admission and block decisions, stamps, corpus, full verification and the native wallet"

[lints]
workspace = true

[dependencies]
# Wire types, pinned `Enc`, the public digests and the closed launch gate.
iroha_data_model = { workspace = true, default-features = false, features = ["application-model"] }
# The registration and vote relations; this crate compiles only the candidate row.
iroha_parliament_ballot_proof = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
# Operating-system entropy for credentials, proving tapes and stamp start nonces.
getrandom = { workspace = true }
# Midstate of the stamp work digest in the nonce search; the digest is the data model's
# `stamp_work_digest_v1`, which the tests cross-check.
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }

[dev-dependencies]
# Structural block construction for genuine-ballot wire/result roundtrip tests.
iroha_data_model = { workspace = true, features = ["transparent_api"] }
# Explicit native stack, arena mapping and shared fatal page of the diagnostic example.
libc = "0.2.177"
# The fixture generator diagnoses its deliberately late-invalid proof through the backend.
iroha_zkp_vole = { workspace = true }
