[package]
name = "iroha_core_timed_ovn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "State-free Parliament timed-OVN evidence and public TLE verification"

[lints]
workspace = true

[features]
default = []
test-utils = ["dep:rand"]

[dependencies]
arrayvec = "0.7.6"
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "pqc"] }
iroha_data_model = { workspace = true, default-features = false, features = ["transparent_api"] }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
sha2 = { version = "0.10.9", default-features = false, features = ["compress"] }
thiserror = { workspace = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
