[package]
name = "iroha_kagami"     # Translates to teacher, the exemplar, the looking glass.
autobins = false

edition.workspace = true
version.workspace = true
authors.workspace = true

description = "Managed Iroha developer networks and contract deployment, with native operator tools."

license.workspace = true

[lints]
workspace = true

[dependencies]
iroha = { workspace = true }
iroha_deploy = { workspace = true }
iroha_fs = { workspace = true }
iroha_contract_deploy = { path = "../iroha_contract_deploy" }
musubi = { path = "../musubi" }
iroha_core_privacy = { workspace = true, default-features = false }
iroha_model_base = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_executor_data_model.workspace = true
iroha_data_model = { workspace = true, default-features = false, features = ["application-model", "privacy-exact12-conformance"] }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_schema_gen.workspace = true
iroha_primitives.workspace = true
iroha_genesis.workspace = true
iroha_test_samples.workspace = true
iroha_schema.workspace = true
iroha_core = { workspace = true, features = ["node"], default-features = false }
iroha_sumeragi = { workspace = true }
iroha_config.workspace = true

iroha_swarm = { path = "../iroha_swarm" }

clap = { workspace = true, features = ["derive"] }
clap-markdown = "0.1.5"
owo-colors = { workspace = true }
color-eyre.workspace = true
derive_more.workspace = true
toml = { version = "0.9.8" }

blake3.workspace = true
hex = { workspace = true }
base64.workspace = true
rand = { workspace = true }
tempfile = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
inquire = "0.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
# Synthetic release constructors are test-only; shipping operator builds never enable them.
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures"] }
iroha_core = { workspace = true, default-features = false, features = [
    "iroha-core-tests",
] }

[features]
default = ["gost", "sm"]
dev-tools = []
gost = ["iroha_config/gost", "iroha_crypto/gost", "iroha_data_model/gost"]
sm = [
    "iroha_config/sm",
    "iroha_crypto/sm",
    "iroha_data_model/sm",
    "iroha_genesis/sm",
]

[[bin]]
name = "kagami"
path = "src/main.rs"

[[bin]]
name = "iroha_authenticated_tool_controller"
path = "src/bin/iroha_authenticated_tool_controller.rs"
required-features = ["dev-tools"]
