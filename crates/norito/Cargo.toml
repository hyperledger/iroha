[package]
name = "norito"
autobins = false
autotests = false
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
iroha_allocation.workspace = true
byteorder = "1.5"
thiserror.workspace = true
norito_derive = { path = "../norito_derive" }
crc64fast = "1.1"
iroha_schema.workspace = true
simdutf8 = { version = "0.1.5", optional = true }
rayon = { version = "1.11.0", optional = true }
url.workspace = true
sha3 = "0.10.8"
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
toml.workspace = true
hkdf = "0.12.4"
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false, features = ["alloc", "getrandom", "rand_core"] }
blake3 = "1.8.2"
iroha_audio = { path = "../iroha_audio" }
ryu = "1.0.20"
zstd.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
gpuzstd_metal = { path = "../gpuzstd_metal", optional = true }

[dev-dependencies]
criterion = { workspace = true }
rand = "0.9.3"
regex = { version = "1.12.2", default-features = false, features = ["std"] }
iroha_schema = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

