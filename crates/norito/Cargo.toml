[[bin]]
name = "norito_regen_goldens"
path = "src/bin/norito_regen_goldens.rs"
required-features = ["dev-tools"]
[features]
default = ["node-codec"]
dev-tools = []
# Test-only §13.4 selector; never forwarded to dependencies.
mutation-testing = []
# Minimum currently compilable codec surface. `json` remains here until the
# existing unconditional JSON helpers are made feature-independent. Panic
# containment is part of every decoder and is not feature-selectable.
base-codec = ["json"]
# Canonical codec surface used by node, CLI, and network-facing crates.
# Portable accelerators are always compiled and retain deterministic scalar
# fallbacks; platform-specific Stage-1/CRC backends remain explicit leaves.
node-codec = [
    "base-codec",
    "compression",
    "columnar",
    "json-std-io",
    "simd-accel",
    "crc-key-hash",
    "simdutf8-validate",
    "parallel-stage1-rayon",
]
simd-accel = []
compression = []
gpu-compression = ["compression", "dep:gpuzstd_metal"]
schema-structural = ["iroha_audio/schema-structural"]
json = []
json-std-io = []
bench-internal = []
bench = []
metal-stage1 = []
cuda-stage1 = []
metal-crc64 = []
cuda-crc64 = []
streaming-neural-filter = []
streaming-fixed-point-dct = []
codec-gpu = ["codec-gpu-metal", "codec-gpu-cuda"]
codec-gpu-metal = ["metal-stage1", "metal-crc64"]
codec-gpu-cuda = ["cuda-stage1", "cuda-crc64"]
simdutf8-validate = ["simdutf8"]
columnar = []
stage1-validate = []
crc-key-hash = []
parallel-stage1 = []
parallel-stage1-rayon = ["rayon", "parallel-stage1"]
adaptive-telemetry = []
adaptive-telemetry-log = ["adaptive-telemetry"]

