[package]
name = "ivm_artifact_admission"
version.workspace = true
edition = "2024"
authors = ["Iroha Contributors"]
description = "Host-independent admission for deployable IVM contract artifacts"
license = "Apache-2.0"
repository.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "ivm_artifact_admit"
path = "src/bin/ivm_artifact_admit.rs"
required-features = ["dev-tools"]

[features]
# Developer-only golden-regeneration and artifact release-gate binary.
dev-tools = []

[dependencies]
iroha_allocation = { workspace = true }
iroha_fs = { workspace = true }
iroha_model_base = { workspace = true }
iroha_crypto = { path = "../iroha_crypto", default-features = false, features = ["json"] }
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["transparent_api"] }
ivm_abi = { path = "../ivm_abi" }
kotodama_surface = { path = "../kotodama_surface" }
norito = { path = "../norito", default-features = false, features = ["node-codec"] }

[dev-dependencies]
kotodama_lang = { path = "../kotodama_lang" }
mv = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
hex = { workspace = true, features = ["alloc"] }
tempfile = { workspace = true }

[lints]
workspace = true
