[package]
name = "kotodama_lang"
autotests = false
version.workspace = true
edition = "2024"
authors = ["Iroha Contributors"]
description = "Kotodama compiler for IVM bytecode"
license = "Apache-2.0"
repository = "https://github.com/hyperledger-iroha/iroha"
documentation = "https://docs.rs/kotodama_lang"

[dependencies]
iroha_fs = { workspace = true }
iroha_model_base = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
indexmap = "2.12.0"
iroha_crypto = { path = "../iroha_crypto", default-features = false, features = ["json"] }
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["transparent_api", "governance", "bls"] }
iroha_i18n = { path = "../iroha_i18n" }
iroha_primitives = { path = "../iroha_primitives", default-features = false }
ivm_abi = { path = "../ivm_abi" }
ivm_artifact_admission = { path = "../ivm_artifact_admission" }
kotodama_surface = { path = "../kotodama_surface" }
norito = { path = "../norito", default-features = false, features = ["node-codec"] }

[[test]]
name = "kotodama_integration"
path = "tests/kotodama_integration.rs"
