[package]
name = "sorafs_manifest"
autobins = false
autotests = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Norito-encoded manifest types for SoraFS artifacts."

[features]
# No `default` feature: consumers request `pqc` explicitly, so focused and
# node builds resolve the same feature tokens and share one artifact.
dev-tools = []
pqc = ["iroha_crypto/pqc", "soranet_pq/pqc"]

[[bin]]
name = "generate_hedging_fixtures"
path = "src/bin/generate_hedging_fixtures.rs"
required-features = ["dev-tools"]

[[bin]]
name = "generate_orderbook_fixtures"
path = "src/bin/generate_orderbook_fixtures.rs"
required-features = ["dev-tools"]

[[bin]]
name = "generate_pdp_fixtures"
path = "src/bin/generate_pdp_fixtures.rs"
required-features = ["dev-tools"]

[[bin]]
name = "generate_por_fixtures"
path = "src/bin/generate_por_fixtures.rs"
required-features = ["dev-tools"]

[[bin]]
name = "generate_replication_order_fixture"
path = "src/bin/generate_replication_order_fixture.rs"
required-features = ["dev-tools"]

[dependencies]
blake3 = "1.8.2"
hex = "0.4.3"
base64 = { workspace = true, features = ["std"] }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
thiserror = "2.0.17"
url = { workspace = true }
sorafs_chunker = { path = "../sorafs_chunker" }
ed25519-dalek = "2.2.0"
iroha_crypto = { workspace = true, default-features = false, features = ["application", "bls"] }
iroha_primitives = { workspace = true }
iroha_schema = { workspace = true }
soranet_pq = { path = "../soranet_pq", default-features = false }
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false, features = ["alloc", "getrandom", "rand_core"] }
rand = { workspace = true }

iroha_pasta = { workspace = true }
iroha_plonk = { workspace = true }
ff = "0.13.1"

[dev-dependencies]
iroha_plonk_gadgets = { workspace = true }
tempfile = "3.23.0"
assert_cmd = "2.1.1"
rand_chacha = "0.9"

[[test]]
name = "sorafs_manifest_integration"
path = "tests/sorafs_manifest_integration.rs"
