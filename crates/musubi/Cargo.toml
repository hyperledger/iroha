[package]
name = "musubi"

edition.workspace = true
version.workspace = true
authors.workspace = true

description = "Kotodama source package manager for Iroha"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords = ["blockchain", "iroha", "kotodama", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
iroha_model_base = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
hex = { workspace = true }
iroha = { workspace = true }
iroha_wallet = { workspace = true }
iroha_contract_deploy = { workspace = true }
iroha_fs = { workspace = true }
iroha_musubi_service = { workspace = true }
iroha_storage_client = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["application-model"] }
iroha_primitives = { workspace = true }
ivm = { workspace = true }
kotodama_lang = { workspace = true }
kotodama_surface = { workspace = true }
kotodama_toolchain = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
sorafs_car = { workspace = true, features = ["manifest"] }
sorafs_manifest = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }
tempfile = { workspace = true }
