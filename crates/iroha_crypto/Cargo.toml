[package]
name = "iroha_crypto"
autobins = false
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[lints]
workspace = true

[features]
default = ["node-crypto"]
dev-tools = []
# Diagnostic arithmetic fixtures; request only from development dependencies.
bfv-test-fixtures = []
# General application surface. Consensus-only consumers should use
# `consensus` so they do not pull PQC and batch-verification helpers.
application = ["rand", "json", "ecc-batch", "bfv-accel", "pqc"]
# Cryptography required by consensus and canonical node identities.
consensus = ["rand", "bls"]
# Complete portable shipping node surface.
node-crypto = ["application", "consensus", "gost", "sm", "rayon"]
json = ["norito/json"]
# Exact CRT-NTT ring products for BFV and the NEON/AVX2 kernels of the shared
# FHE arithmetic. Both return the words of the scalar reference.
bfv-accel = ["iroha_fhe/simd"]
# Enable GOST R 34.10-2012 with Streebog, CryptoPro 256-bit A/B/C and RFC 7836 512-bit A/B.
# Implementation and parameter ownership live in `signature::gost`.
gost = ["dep:once_cell", "dep:num-bigint", "dep:num-traits", "dep:streebog", "dep:crypto-bigint"]
# Enable Chinese national (SM2/SM3/SM4) algorithms.
sm-ccm = []
sm = ["sm-ccm", "dep:sm2", "dep:sm3", "dep:sm4", "dep:rfc6979", "dep:sm4_gcm", "sm-neon"]
sm-ffi-openssl = ["dep:openssl"]
sm-neon = ["dep:sm4-neon", "dep:sm3-neon"]
sm-neon-force = ["sm", "sm-neon", "sm4-neon/force-neon", "sm3-neon/force-neon"]
crypto-parity-tests = ["dep:amcl", "dep:openssl", "dep:secp256k1"]
# Enable support for BLS signatures. The shipping `node-crypto` aggregate includes it.
bls = ["dep:arrayvec", "dep:ark-serialize", "dep:blst", "dep:blstrs", "dep:group", "dep:pairing", "dep:w3f-bls"]

# Allow creating key using random number generator which is tricky in some environments like Smart Contracts
rand = []
# Enable parallel helpers for Merkle tree construction
rayon = ["dep:rayon"]
# Enable elliptic-curve batch verification (deterministic) where available.
# - Ed25519 uses ed25519-dalek's MSM-based batch verify with a deterministic transcript
# - Secp256k1 remains per-signature (no secure MSM batch included); kept for symmetry
ecc-batch = ["ed25519-dalek/batch"]
pqc = ["dep:pqcrypto-traits", "dep:pqcrypto-mldsa", "dep:soranet_pq"]

[dependencies]
iroha_allocation = { workspace = true }
fastpq_isi = { path = "../fastpq_isi" }
iroha_fhe = { path = "../iroha_fhe", default-features = false }
iroha_primitives = { workspace = true }
iroha_schema = { workspace = true }

derive_more = { workspace = true, features = ["deref", "deref_mut", "display", "debug"] }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
hex = { workspace = true, features = ["alloc", "std"] }
hex-literal = { workspace = true }
getset = { workspace = true }
thiserror = { version = "2.0.17" }
displaydoc = { workspace = true, features = ["std"] }
blake3 = { workspace = true, features = ["zeroize"] }
base64 = { workspace = true }
soranet_pq = { workspace = true, optional = true }

digest = { version = "0.10.7", default-features = false, features = ["alloc", "std"] }
blake2 = { version = "0.10.6", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }
hkdf = { version = "0.12.4", default-features = false, features = ["std"] }
arrayvec = { version = "0.7.6", optional = true }
# Preserve the actual typed point-decoder diagnostic without formatting in the fixed core.
ark-serialize = { version = "0.4.2", default-features = false, optional = true, features = ["std"] }
w3f-bls = { version = "0.1.9", default-features = false, optional = true, features = ["std"] }
rayon = { version = "1.11.0", optional = true }
blst = { version = "=0.3.16", default-features = false, optional = true }
blstrs = { version = "0.7.1", default-features = false, optional = true }
group = { version = "0.13", default-features = false, optional = true }
subtle = { version = "2.6.1", default-features = false }
pairing = { version = "0.23", default-features = false, optional = true }
parking_lot = { workspace = true }

signature = { version = "2.2.0", default-features = false, features = ["alloc", "std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "rand_core", "zeroize", "std"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }

rand = { workspace = true, default-features = false, features = ["std_rng", "alloc", "std"] }
rand_core_06 = { workspace = true }
rand_core = { version = "0.9.3", default-features = false, features = ["os_rng", "std"] }
rand_chacha = { version = "0.9.0", default-features = false, features = ["std"] }
once_cell = { version = "1.21.3", default-features = false, features = ["std"], optional = true }
tempfile = { workspace = true }
num-bigint = { version = "0.4.6", default-features = false, features = ["std"], optional = true }
num-traits = { version = "0.2.19", default-features = false, features = ["std"], optional = true }
streebog = { version = "0.11.0", default-features = false, optional = true }
crypto-bigint = { version = "0.6.1", default-features = false, features = ["alloc", "rand"], optional = true }
sm2 = { version = "0.13.3", optional = true, default-features = false, features = ["std", "dsa", "pkcs8", "pem"] }
sm3 = { version = "0.5.0-rc.3", optional = true }
sm4 = { version = "0.5.1", optional = true }
rfc6979 = { version = "0.4", optional = true, default-features = false }
sm4_gcm = { package = "sm4-gcm", version = "0.1.2", optional = true, default-features = false }
sm4-neon = { path = "../sm4_neon", optional = true }
sm3-neon = { path = "../sm3_neon", optional = true }
openssl = { version = "0.10.75", optional = true, default-features = false, features = ["vendored"] }
amcl = { version = "0.2.0", optional = true, default-features = false, features = ["secp256k1"] }
secp256k1 = { version = "0.31.1", optional = true, features = ["rand"] }


zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }

aead = { version = "0.6.0-rc.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false, features = ["alloc", "getrandom", "rand_core", "zeroize"] }
elliptic-curve = { version = "0.13.8", default-features = false, features = ["std"] }
k256 = { version = "0.13.4", default-features = false, features = ["alloc", "ecdsa", "sha256", "std"] }

argon2 = { version = "0.5.3", default-features = false, features = ["std"] }

# PQC (ML-DSA available by default, ML-KEM available through `soranet_pq`)
pqcrypto-traits = { version = "0.3.5", optional = true }
time = { workspace = true, features = ["formatting", "parsing"] }

# pqcrypto-mldsa's NEON C backend is not compatible with MSVC. Keep ML-DSA
# enabled on Windows/AArch64 through its portable clean C implementation.
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
pqcrypto-mldsa = { version = "0.1.2", default-features = false, features = ["std"], optional = true }

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
pqcrypto-mldsa = { version = "0.1.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
# Offline R.11 equation-oracle composition tests only; no production fixture edge.
iroha_fhe = { path = "../iroha_fhe", default-features = false, features = ["bgv-test-fixtures"] }
criterion = { workspace = true }
norito = { workspace = true, default-features = false, features = ["compression"] }
num-bigint = "0.4.6"
lazy_static = "1.5.0"

[[bin]]
name = "gost_perf_check"
path = "src/bin/gost_perf_check.rs"
required-features = ["dev-tools", "gost"]

[[bin]]
name = "sm_perf_check"
path = "src/bin/sm_perf_check.rs"
required-features = ["dev-tools", "sm"]

[[bin]]
name = "soranet_handshake_check"
path = "src/bin/soranet_handshake_check.rs"
required-features = ["dev-tools"]
[[bench]]
name = "gost_sign"
harness = false
required-features = ["gost"]

[[bench]]
name = "sm_perf"
harness = false
required-features = ["sm"]

[[bench]]
name = "soranet_handshake"
harness = false

[[bench]]
name = "ed25519_hotpaths"
harness = false

[[bench]]
name = "parliament_crypto"
harness = false
required-features = ["bls"]

# Grouped integration-test harnesses keep `cargo test` from linking one binary per tests/*.rs file.

[[test]]
name = "iroha_crypto_group_01"
path = "tests/grouped/group_01.rs"

# Scalar identity fixtures qualify minimal and optional crypto features independently.
[[test]]
name = "manual_scalar_identity"
path = "tests/manual_scalar_identity.rs"

# Observe the real private tree allocation, including concurrent final owners.
[[test]]
name = "ordered_digest_allocation_custody"
path = "tests/ordered_digest_allocation_custody.rs"

# Exact resident lookup-node allocation and final-refund controls.
[[test]]
name = "merkle_map_allocation_custody"
path = "tests/merkle_map_allocation_custody.rs"

# Exact original-pool allocation/refusal and final-release order for public keys.
[[test]]
name = "public_key_allocation_custody"
path = "tests/public_key_allocation_custody.rs"

# Observe borrowed ML-DSA verification separately from caller-owned envelopes.
[[test]]
name = "mldsa_borrowed_verification"
path = "tests/mldsa_borrowed_verification.rs"

# Observe fixed semantic rejections independently of decode-budget counters.
[[test]]
name = "public_key_decode_failure_custody"
path = "tests/public_key_decode_failure_custody.rs"
