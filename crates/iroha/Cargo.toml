[package]
name = "iroha"
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[badges]
is-it-maintained-issue-resolution = { repository = "https://github.com/hyperledger-iroha/iroha" }
is-it-maintained-open-issues = { repository = "https://github.com/hyperledger-iroha/iroha" }
maintenance = { status = "actively-developed" }

[features]
# Use rustls by default to avoid OpenSSL dependency, simplifying compilation with musl.
# Enable every portable production algorithm while retaining one coherent TLS policy.
default = ["tls-rustls-native-roots", "gost", "sm"]
# Expose deterministic, secret-free fixture constructors only to repository tooling.
test-fixtures = ["iroha_data_model/test-fixtures"]
# Non-shipping, operator-authenticated reader for the feature-isolated APS
# release-evidence state-commitment route.
test-network-private-settlement-evidence = []
sm = [
    "iroha_crypto/sm",
    "iroha_data_model/sm",
]
gost = [
    "iroha_crypto/gost",
    "iroha_data_model/gost",
]

tls-native = [
    "reqwest/native-tls",
    "tokio-tungstenite/native-tls",
    "tungstenite/native-tls",
]
tls-native-vendored = [
    "reqwest/native-tls-vendored",
    "tokio-tungstenite/native-tls-vendored",
    "tungstenite/native-tls-vendored",
]
tls-rustls-native-roots = [
    "reqwest/rustls-tls-native-roots",
    "tokio-tungstenite/rustls-tls-native-roots",
    "tungstenite/rustls-tls-native-roots",
]
tls-rustls-webpki-roots = [
    "reqwest/rustls-tls-webpki-roots",
    "tokio-tungstenite/rustls-tls-webpki-roots",
    "tungstenite/rustls-tls-webpki-roots",
]

[dependencies]
iroha_fs = { workspace = true }
iroha_model_base = { workspace = true }
iroha_service_model = { workspace = true }
bytes = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_config_base = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_primitives = { workspace = true }
tracing = { workspace = true }
iroha_torii_shared = { workspace = true }
iroha_version = { workspace = true }
iroha_sccp = { workspace = true }
sorafs_manifest = { workspace = true }

iroha_data_model = { workspace = true, default-features = false, features = ["application-model", "http", "transparent_api"] }
iroha_executor_data_model = { workspace = true }

reqwest = { workspace = true, features = ["blocking"] }
eyre = { workspace = true }
error-stack = { workspace = true }
http = "1.3.1"
url = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
derive_more = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
futures-util = "0.3.31"
toml = { workspace = true }
blake3.workspace = true
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
iroha_sumeragi = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
iroha_test_samples = { workspace = true }
assertables = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "tx_ttl"
path = "tests/tx_ttl.rs"
