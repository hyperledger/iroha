[package]
name = "iroha_sccp_rpc"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "SCCP v1 network I/O: public-RPC endpoints and untrusted evidence builders"

[lints]
workspace = true

[dependencies]
iroha_sccp = { workspace = true }
iroha_data_model = { workspace = true, default-features = false }
iroha_config = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
# Blocking HTTP over rustls only; JSON is parsed with `norito::json`, never reqwest's `json`.
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
hex = { workspace = true, features = ["std"] }
zeroize = { workspace = true }
# TON ADNL-TCP handshake: x25519 key agreement, Ed25519 identities and AES-256-CTR framing.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize"] }
# `zeroize` wipes the session key schedules and counters when a session drops.
aes = { version = "0.8.4", features = ["zeroize"] }
ctr = { version = "0.9.2", features = ["zeroize"] }
# OS randomness for ADNL ephemeral keys and session parameters; thread RNG for nonces and query ids.
rand = { workspace = true }

[dev-dependencies]
# Builder tests prove events of the synthetic source chains (`test_support`) through the
# production verifier.
iroha_sccp = { workspace = true, features = ["test-fixtures"] }
