[package]
name = "ivm-fuzz"
version = "2.0.0-rc.2.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4.10", features = ["arbitrary-derive"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
ivm = { path = ".." }
ivm_abi = { path = "../../ivm_abi" }
kotodama_lang = { path = "../../kotodama_lang" }
iroha_primitives = { path = "../../iroha_primitives" }

[dev-dependencies]
iroha_allocation = { path = "../../iroha_allocation" }

[workspace]
members = ["."]

[patch.crates-io]
# Preserve the root workspace's fallible native-digit allocation handoff.
num-bigint = { path = "../../../vendor/num-bigint-0.4.6" }

[[bin]]
name = "tlv_validate"
path = "fuzz_targets/tlv_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kotodama_lower"
path = "fuzz_targets/kotodama_lower.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numeric_v1"
path = "fuzz_targets/numeric_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifact_admission_v1"
path = "fuzz_targets/artifact_admission_v1.rs"
test = false
doc = false
bench = false
