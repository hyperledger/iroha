[package]
name = "ivm"
autobins = false
autotests = false
version.workspace = true
edition = "2024"
authors = ["Iroha Contributors"]
description = "Iroha Virtual Machine implementation"
license = "Apache-2.0"
repository = "https://github.com/hyperledger/ivm"
documentation = "https://docs.rs/ivm"
build = "build.rs"

[dependencies]
thiserror = { workspace = true }
iroha_allocation = { workspace = true }
iroha_accel = { workspace = true }
iroha_model_base = { workspace = true }
sha2 = { version = "0.10.9" }
sha3_hash = { package = "sha3", version = "0.10.8", default-features = false, features = ["std"] }
ff = { version = "0.13.1", features = ["derive"] }
halo2curves = { workspace = true }
rayon = "1.11.0"
num_cpus = "1.17.0"
likely_stable = "0.1.3"
parking_lot = "0.12.5"
indexmap = "2.12.0"
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["transparent_api", "governance", "bls"] }
iroha_crypto = { path = "../iroha_crypto", default-features = false, features = ["node-crypto", "rayon", "sm"] }
norito = { path = "../norito", default-features = false, features = ["node-codec"] }
iroha_zkp_halo2 = { path = "../iroha_zkp_halo2" }
iroha_primitives = { path = "../iroha_primitives" }
iroha_telemetry = { path = "../iroha_telemetry" }
iroha_i18n = { path = "../iroha_i18n" }
ivm_abi = { path = "../ivm_abi" }
ivm_artifact_admission = { path = "../ivm_artifact_admission" }
nonzero_ext = { workspace = true }
## Do not depend on serde/serde_json directly; use `norito::json` helpers instead.
## serde and serde_json are pulled in via `norito` internally when needed.
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = "2.2.0"
curve25519-dalek = "4.1.3"
rand_core = "0.9.3"
pqcrypto-traits = { version = "0.3.5" }
blstrs = "0.7.1"
group = "0.13"
pairing = "0.23"
crypto-bigint = "0.6.1"
rodio = { version = "0.21.1", optional = true }
k256 = { version = "0.13.4", features = ["ecdsa"] }
signature = "2.2.0"
cust = { version = "0.3.2", optional = true }

# pqcrypto-mldsa's NEON C backend is not compatible with MSVC. Keep ML-DSA
# enabled on Windows/AArch64 through its portable clean C implementation.
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
pqcrypto-mldsa = { version = "0.1.2", default-features = false, features = ["std"] }

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
pqcrypto-mldsa = { version = "0.1.2" }

# sha2-asm rejects every Windows target; keep the portable implementation there.
[target.'cfg(all(target_arch = "x86_64", not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", optional = true, features = ["dispatch2"] }
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
dispatch2 = { version = "0.3.1", optional = true }


[dev-dependencies]
# Driverless admission tests use the real failure type and runtime-loaded owner.
# This does not itself enable IVM's optional authenticated CUDA build path.
iroha_accel = { workspace = true, features = ["cuda"] }
criterion = { workspace = true }
kotodama_lang = { path = "../kotodama_lang" }
kotodama_surface = { path = "../kotodama_surface" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
hex-literal = "1.1.0"

[build-dependencies]
# Reuse the production Rust crypto libraries in the build-script context.
# CUDA builds authenticate retained material or admit genuine absence.
# No ordinary build invokes CUDA tooling or loads a driver.
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"

[features]
# Ordinary builds include Metal on macOS; its dependencies are target-scoped and
# the same feature is inert on other targets. CPU SIMD is always compiled and
# selected by hardware capability. Linux/Windows daemon dependencies include
# CUDA; absent source-approved artifacts preserve CPU builds and startup.
default = ["metal"]
dev-tools = []
# Expose benchmark-only backend selection hooks. Production builds must leave
# this disabled so field dispatch is immutable after hardware selection.
bench = []
beep = ["dep:rodio"]
cuda = ["dep:cust", "iroha_accel/cuda"]
# Opt-in qualification requires real CUDA work; absent hardware is a test failure.
cuda-hardware-tests = ["cuda"]
# Opt-in qualification fails unless every production Metal pipeline executes.
metal-hardware-tests = ["metal"]
# JSON parsing in tests and host helpers should use `norito::json` wrappers,
# avoiding direct serde usage. No feature gating is required.
metal = [
    # macOS-only optional deps, no-ops on other targets
    "dep:objc2-metal",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:dispatch2",
]
## Dev-only test gate used by poseidon_simd.rs; declared to silence unexpected-cfg warnings.
ivm_zk_tests = []
## Dev-only test gate used by vrf_verify_chain.rs; declared to silence unexpected-cfg warnings.
ivm_vrf_tests = []

[[bin]]
name = "gas_probe"
path = "src/bin/gas_probe.rs"
required-features = ["dev-tools"]

