[package]
name = "iroha_core_zk"
autotests = false
autobins = false

edition.workspace = true
version.workspace = true
authors.workspace = true

description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "kagemusha_wallet_artifacts"
path = "src/bin/kagemusha_wallet_artifacts.rs"
required-features = ["dev-tools"]

[[example]]
name = "confidential_redemption"

[[test]]
name = "iroha_core_zk_group"
path = "tests/grouped.rs"
required-features = ["zk-tests"]

[features]
# Offline packaging generators are built only through explicit artifact selection.
dev-tools = []
# Every build includes native PIPA-R proving and verification. Defaults also
# select STARK and advisory pre-verification; test fixtures remain separate.
default = ["proofs-stark", "zk-preverify"]
proofs-stark = ["zk-stark"]
# Native PIPA-R opening/proving is mandatory in every build.
# STARK remains a separately selected algorithm.
zk-stark = ["dep:fastpq_prover"]
# Enable stateless advisory pre-verification, deduplication, and trace diagnostics.
zk-preverify = []
# Non-shipping helpers and fixtures for iroha_core's test builds; forbidden in
# shipping library evidence (scripts/taira_release_check.py).
test-utils = []
# Gate zk-heavy tests; enable with `--features zk-tests` when needed.
zk-tests = ["test-utils"]

[dependencies]
# Genuine wallet sigma/Q/A/W producers; this crate adds the G1/native custody adapter.
iroha_kagemusha_proof = { path = "../iroha_kagemusha_proof", default-features = false }
iroha_plonk_gadgets = { path = "../iroha_plonk_gadgets", default-features = false }
iroha_plonk = { path = "../iroha_plonk", default-features = false }
iroha_plonk_recursion = { path = "../iroha_plonk_recursion", default-features = false }
iroha_pasta = { path = "../iroha_pasta", default-features = false }
iroha_fs = { workspace = true }
iroha_primitives = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_data_model = { workspace = true, default-features = false, features = ["transparent_api", "governance", "http"] }
iroha_sumeragi = { workspace = true }
iroha_version = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "pqc"] }
ivm_abi = { workspace = true }
fastpq_prover = { workspace = true, optional = true }
fastpq_isi = { path = "../fastpq_isi" }
tracing = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["compress"] }
ff = "0.13.1"
iroha_zkp_halo2 = { workspace = true }
kaigi_zk = { path = "../kaigi_zk" }
base64 = { workspace = true }
blake3 = "1.8.2"
hex = { workspace = true }
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa", "pkcs8", "hash2curve", "expose-field"] }
rand = { workspace = true }
rand_core_06 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }

[dev-dependencies]
iroha_zkp_poseidon = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["transparent_api", "test-fixtures"] }
