[package]
name = "iroha_js_host"

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

build = "build.rs"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
iroha_core_privacy = { workspace = true, default-features = false, features = ["zk-stark"] }
iroha_model_base = { workspace = true }
iroha_js_codec = { workspace = true }
iroha_service_model = { workspace = true }
napi = { version = "3.5.1", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = { version = "3.3.2", default-features = false, features = ["type-def"] }
iroha_crypto = { workspace = true, features = ["node-crypto", "sm", "gost", "pqc"], default-features = false }
ivm = { workspace = true }
ivm_abi = { workspace = true }
iroha_core_zk = { workspace = true, default-features = false, features = ["proofs-stark", "zk-preverify"] }
iroha_data_model = { workspace = true, features = ["application-model", "transparent_api", "gost", "sm", "bls"], default-features = false }
iroha_primitives = { workspace = true }
iroha_torii_shared = { workspace = true }
iroha_version = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
base64 = { workspace = true }
hex = { workspace = true }
rand_core_06 = { workspace = true }
zeroize = { workspace = true }
sorafs_manifest = { workspace = true }
sorafs_car = { workspace = true, features = ["manifest"] }
blake3 = { workspace = true }
sorafs_orchestrator = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
iroha = { workspace = true }
iroha_storage_client = { workspace = true }
kotodama_lang = { workspace = true }
kaigi_zk = { path = "../kaigi_zk" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
iroha_allocation = { workspace = true }
iroha_sumeragi = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
sorafs_chunker = { workspace = true }
tempfile = { workspace = true }
