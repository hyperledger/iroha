[package]
name = "connect_norito_bridge"
autobins = false
version.workspace = true
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("schema-structural"))',
] }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "soracloud_request_signer"
path = "src/bin/soracloud_request_signer.rs"
required-features = ["dev-tools"]

[[bin]]
name = "swift_parity_regen"
path = "src/bin/swift_parity_regen.rs"
required-features = ["dev-tools"]

[features]
dev-tools = []
# Fixed native-build provenance marker. Privacy support is compiled unconditionally;
# this empty feature grants no proving, provider, hardware or release qualification.
privacy-production-enabled = []
# Build the JNI acceleration surface against IVM's real CUDA backend. This is
# selected only by hardware-qualified release validation; the default bridge
# keeps the deterministic CPU fallback.
cuda = ["ivm/cuda"]

[dependencies]
iroha_core_privacy = { workspace = true, default-features = false, features = ["zk-stark"] }
iroha_core_timed_ovn = { workspace = true }
iroha_model_base = { workspace = true }
norito = { path = "../norito", version = "2.0.0-rc.2.0", default-features = false, features = ["node-codec"] }
# The production bridge selects the complete Halo2/IPA circuit-parameter and
# STARK/FRI verifier paths explicitly on the proof and privacy owner crates.
iroha_core_zk = { path = "../iroha_core_zk", default-features = false, features = ["proofs-stark", "zk-preverify"] }
iroha_torii_shared = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "gost", "pqc", "sm"] }
# The bridge ships the exact-12 KAT generator/validator, but must not expose the
# data model's general fixture constructors or block-tampering helpers.
iroha_data_model = { workspace = true, features = ["application-model", "sm", "privacy-exact12-conformance"], default-features = false }
iroha_executor_data_model = { workspace = true }
iroha_primitives = { workspace = true }
iroha_version = { workspace = true }
ivm = { workspace = true }
iroha_accel = { workspace = true }
libc = "0.2.177"
blake3.workspace = true
base64 = { workspace = true }
hex = "0.4"
x25519-dalek = "2.0.1"
sorafs_car = { workspace = true, features = ["manifest"] }
sorafs_manifest = { workspace = true }
rand = { version = "0.9.3", default-features = false, features = ["os_rng", "std", "std_rng"] }
tracing.workspace = true
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
tempfile = { workspace = true }

[dev-dependencies]
iroha_core_zk = { workspace = true, default-features = false, features = ["test-utils"] }
iroha_core_privacy = { workspace = true, default-features = false, features = ["test-utils"] }
iroha_core_timed_ovn = { workspace = true, features = ["test-utils"] }
# Synthetic portable-proof fixtures remain test-only; production exports no fixture constructors.
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
iroha_core = { path = "../iroha_core", default-features = false, features = ["node", "iroha-core-tests"] }
sorafs_chunker = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
jni = { version = "0.21.1", default-features = false }
