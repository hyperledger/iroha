[package]
name = "ivm_abi"
version.workspace = true
edition = "2024"
authors = ["Iroha Contributors"]
description = "Shared ABI definitions for the Iroha Virtual Machine"
license = "Apache-2.0"
repository = "https://github.com/hyperledger-iroha/iroha"
documentation = "https://docs.rs/ivm_abi"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("schema-structural"))',
] }

[dependencies]
hex = { workspace = true, features = ["alloc"] }
iroha_primitives = { workspace = true, default-features = false, features = ["json"] }
iroha_allocation = { workspace = true }
iroha_model_base = { workspace = true }
iroha_data_model = { path = "../iroha_data_model", default-features = false, features = ["transparent_api", "governance"] }
iroha_crypto = { path = "../iroha_crypto", default-features = false, features = ["json"] }
norito = { path = "../norito", default-features = false, features = ["node-codec"] }

[dev-dependencies]
hex-literal = { workspace = true }
