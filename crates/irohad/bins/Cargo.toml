[package]
name = "irohad"
autobins = false
autotests = false
autoexamples = false
autobenches = false
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "../../build-support/script.rs"

[lints]
workspace = true

[features]
default = ["daemon", "irohad_lib/default"]
daemon = ["irohad_lib/daemon", "telemetry", "schema-endpoint", "gost", "sm", "dag-recovery-verify", "expensive-telemetry"]
external-software-signer-bin = ["daemon"]
dev-tools = ["daemon", "zk-stark", "irohad_lib/dev-tools"]
accel-metal = ["fastpq-gpu", "irohad_lib/accel-metal"]
accel-cuda = ["fastpq-gpu", "irohad_lib/accel-cuda"]
test-network-private-settlement-route-control = ["irohad_lib/test-network-private-settlement-route-control"]
test-network-parliament-signers = ["irohad_lib/test-network-parliament-signers"]
test-network-disposable-broker = ["daemon", "irohad_lib/test-network-disposable-broker"]
fastpq-gpu = ["irohad_lib/fastpq-gpu"]
zk-stark = ["irohad_lib/zk-stark"]
sm = ["irohad_lib/sm"]
gost = ["irohad_lib/gost"]
sm-ffi-openssl = ["sm", "irohad_lib/sm-ffi-openssl"]
beep = ["irohad_lib/beep"]
dag-recovery-verify = ["irohad_lib/dag-recovery-verify"]
telemetry = ["irohad_lib/telemetry"]
expensive-telemetry = ["telemetry", "irohad_lib/expensive-telemetry"]
dev-telemetry = ["telemetry", "irohad_lib/dev-telemetry"]
telegram-alerts = ["telemetry", "irohad_lib/telegram-alerts"]
schema-endpoint = ["irohad_lib/schema-endpoint"]
profiling-endpoint = ["irohad_lib/profiling-endpoint"]

[[bin]]
name = "iroha3d"
path = "src/bin/iroha3d.rs"
required-features = ["daemon"]

[[bin]]
name = "iroha3d_taira"
path = "src/bin/iroha3d_taira.rs"
required-features = ["daemon"]

[[bin]]
name = "sorafs_governance_dag"
path = "src/bin/sorafs_governance_dag.rs"
required-features = ["daemon"]

[[bin]]
name = "taira_bootle_lantern_broker"
path = "src/bin/taira_bootle_lantern_broker.rs"
required-features = ["daemon"]

[[bin]]
name = "sorafs_external_software_signer"
path = "src/bin/sorafs_external_software_signer.rs"
required-features = ["external-software-signer-bin"]

[[bin]]
name = "iroha_test_runtime_provider_broker"
path = "src/bin/iroha_test_runtime_provider_broker.rs"
required-features = ["test-network-disposable-broker"]

[dependencies]
irohad_lib = { path = "..", default-features = false }
iroha_core = { workspace = true, default-features = false }
clap = { workspace = true, features = ["derive"] }
iroha_config = { workspace = true }
iroha_data_model = { workspace = true, default-features = false }
iroha_model_base = { workspace = true }
sorafs_node = { path = "../../sorafs_node" }
sorafs_manifest = { path = "../../sorafs_manifest", default-features = false }
norito = { workspace = true, default-features = false }
hex = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "net", "pipe", "process"] }

[dev-dependencies]
iroha_allocation = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-all-features]
denylist = ["schema-endpoint", "telemetry"]
skip_optional_dependencies = true

[build-dependencies]
build-support = { path = "../../build-support", default-features = false }
