[package]
name = "iroha_private_settlement"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "Native confidential settlement preparation and durable client orchestration"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
iroha = { workspace = true }
iroha_core_privacy = { workspace = true, default-features = false }
iroha_data_model = { workspace = true, default-features = false, features = ["application-model", "http", "transparent_api"] }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_fs = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
eyre = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
iroha_sumeragi = { workspace = true }
iroha_test_samples = { workspace = true }
tempfile = { workspace = true }
http = "1.3.1"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
