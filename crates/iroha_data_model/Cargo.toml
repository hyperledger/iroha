[package]
name = "iroha_data_model"
autotests = false
autobins = false

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[lints]
workspace = true

[features]
# Model-owned spec §13.4 switches; rejected in every non-test library build.
mutation-testing = []
default = ["application-model"]
dev-tools = ["dep:tempfile", "dep:rustix"]
# Public application model; node-only additions are requested by node crates.
application-model = ["governance", "pqc", "bls", "gost", "sm"]
# Expose deterministic fixture constructors to non-shipping release tooling.
test-fixtures = ["iroha_crypto/rand"]
# Expose only the deterministic exact-12 privacy conformance generator and
# bounded validator used by shipping SDK bridges and release evidence. This
# deliberately does not enable `test-fixtures` or its random-key surface.
privacy-exact12-conformance = []
gost = ["iroha_crypto/gost"]
bls = ["iroha_crypto/bls"]
sm = ["iroha_crypto/sm"]
# Enable API for HTTP requests. Should be activated for HTTP clients
http = []
# Expose API for mutating structures (Internal use only)
transparent_api = ["iroha_data_model_derive/transparent_api", "iroha_model_base/transparent_api"]
# Enable fault injection to simulate malicious data tampering during testing.
fault_injection = []
trybuild-tests = ["dep:trybuild"]
bench = []
# Authenticate governed registries against complete Parliament proposal preimages.
governance = []
pqc = ["iroha_crypto/pqc", "sorafs_manifest/pqc"]

[dependencies]
zeroize = { workspace = true }
iroha_allocation = { workspace = true }
# Protocol JSON is mandatory: custom parameters and retained ledger metadata use it.
iroha_data_model_derive = { path = "../iroha_data_model_derive" }
iroha_model_base = { workspace = true }

iroha_primitives = { workspace = true, features = ["json"] }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "json"] }
iroha_macro = { workspace = true }
iroha_version = { workspace = true }
iroha_schema = { workspace = true }
iroha_zkp_poseidon = { workspace = true }
# KAGEMUSHA wallet V1 computes its σ-field values natively with the RP57 Poseidon of the
# Pasta `Fp` field: `credit_id`, the state commitment, chains, map, blacklist, quota-window
# and credit-digest trees, and the packed-byte `proof_digest` and Payment digests.
iroha_pasta = { workspace = true }
hex = { workspace = true }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }

derive_more = { workspace = true, features = ["as_ref", "display", "debug", "constructor", "from_str", "from", "into", "try_into", "deref"] }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
norito_derive = { workspace = true }
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa"] }
sorafs_manifest = { path = "../sorafs_manifest", default-features = false }
thiserror = { workspace = true }
regex = "1.11.0"
displaydoc = { workspace = true, features = ["std"] }
getset = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
bech32 = { workspace = true }
nonzero_ext = { workspace = true }
rustc-hash = { workspace = true }
blake2 = "0.10.6"
blake3 = { workspace = true }
bs58 = "0.5.1"
time = { workspace = true }
fastpq_isi = { path = "../fastpq_isi" }
# Portable current finality verifies the canonical consensus certificate directly.
iroha_sumeragi = { path = "../iroha_sumeragi" }
trybuild = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }

[dev-dependencies]
# Exercise real runtime storage JSON only in model tests.
mv = { workspace = true }
criterion = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus", "gost", "sm", "bfv-test-fixtures"] }
hex-literal = { workspace = true }

tempfile = { workspace = true }

[[bench]]
name = "time_event_filter"
harness = false


[[bench]]
name = "decode_registry"
harness = false

[[bench]]
name = "enum_vs_trait"
harness = false

[[bench]]
name = "chain_wire"
harness = false

[[bin]]
name = "axt_fixtures"
path = "src/bin/axt_fixtures.rs"
required-features = ["dev-tools", "test-fixtures"]

[[bin]]
name = "cancel_asset_lock_fixtures"
path = "src/bin/cancel_asset_lock_fixtures.rs"
required-features = ["dev-tools", "test-fixtures"]

[[bin]]
name = "musubi_fixtures"
path = "src/bin/musubi_fixtures.rs"
required-features = ["dev-tools", "test-fixtures", "transparent_api"]

[[bin]]
name = "privacy_exact12_fixtures"
path = "src/bin/privacy_exact12_fixtures.rs"
required-features = ["dev-tools", "privacy-exact12-conformance"]

# Grouped integration-test harnesses keep `cargo test` from linking one binary per tests/*.rs file.

[[test]]
name = "automatic_validator_rewards"
path = "tests/automatic_validator_rewards.rs"

[[test]]
name = "automatic_reward_evidence"
path = "tests/automatic_reward_evidence.rs"
required-features = ["test-fixtures", "transparent_api"]

[[test]]
name = "staking_reward_identity_capture"
path = "tests/staking_reward_identity_capture.rs"
required-features = ["transparent_api"]

[[test]]
name = "iroha_data_model_group_01"
path = "tests/grouped/group_01.rs"

[[test]]
name = "iroha_data_model_group_02"
path = "tests/grouped/group_02.rs"

[[test]]
name = "query_serialization_allocations"
path = "tests/query_serialization_allocations.rs"

[[test]]
name = "block_signature_serialization_allocations"
path = "tests/block_signature_serialization_allocations.rs"

[[test]]
name = "musubi_text_validation_allocations"
path = "tests/musubi_text_validation_allocations.rs"

[[test]]
name = "contract_subject_derivation"
path = "tests/contract_subject_derivation.rs"

[[test]]
name = "contract_manifest_comparison"
path = "tests/contract_manifest_comparison.rs"

[[test]]
name = "json_object_key_contract"
path = "tests/json_object_key_contract.rs"

[[test]]
name = "sccp_v1_governance"
path = "tests/sccp_v1_governance.rs"

[[test]]
name = "sccp_v1_roundtrip"
path = "tests/sccp_v1_roundtrip.rs"

# Public Activate SDK wire parity, separate from the large internal unit harness.
[[test]]
name = "kagemusha_activate_sdk"
path = "tests/kagemusha_activate_sdk.rs"

# Public IssueLoad SDK wire parity, separate from the large internal unit harness.
[[test]]
name = "kagemusha_issue_load_sdk"
path = "tests/kagemusha_issue_load_sdk.rs"

# Public manual frame contracts compile separately from the large internal unit suite.
[[test]]
name = "manual_frame_identity"
path = "tests/manual_frame_identity.rs"

[[test]]
name = "validator_staking_sdk_fixtures"
path = "tests/validator_staking_sdk_fixtures.rs"

# Canonical V1 RAM-LFE receipt and opening commitments.
[[test]]
name = "ram_lfe_canonical_v1"
path = "tests/ram_lfe_canonical_v1.rs"

# Provider-backed phone-control challenge, credential and provider policy.
[[test]]
name = "phone_control_v1"
path = "tests/phone_control_v1.rs"

# Canonical zk-X509 presentation-interval definition and its shared SDK vectors.
[[test]]
name = "zk_x509_presentation_interval"
path = "tests/zk_x509_presentation_interval.rs"

# Exact-limit and one-over checks of the unified resource contract's committed bounds.
[[test]]
name = "resource_contract_v1"
path = "tests/resource_contract_v1.rs"

# Standalone allocator observer for the canonical fixed-limb quantity kernel.
[[test]]
name = "fastpq_quantity_units_allocations"
path = "tests/fastpq_quantity_units_allocations.rs"

# Observe canonical AMX identity, borrowed Begin matching and monetary-effects allocations.
[[test]]
name = "amx_prepare_streaming_allocations"
path = "tests/amx_prepare_streaming_allocations.rs"
