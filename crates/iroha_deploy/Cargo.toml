[package]
name = "iroha_deploy"

edition.workspace = true
version.workspace = true
authors.workspace = true

description = "Shared native localnet, network and dataspace deployment engine for Kagami and Mochi."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Owning unit-test selectors only; never forwarded to SDK or Core dependencies.
mutation-testing = []

[dependencies]
iroha_allocation = { workspace = true }
iroha_torii_shared = { workspace = true }
iroha = { workspace = true }
iroha_contract_deploy = { workspace = true }
iroha_storage_client = { workspace = true }
iroha_wallet = { workspace = true }
iroha_musubi_service = { workspace = true }
iroha_config = { workspace = true }
iroha_core = { workspace = true, default-features = false, features = ["node"] }
iroha_core_zk = { workspace = true, default-features = false }
iroha_genesis = { workspace = true }
iroha_executor_data_model = { workspace = true }
color-eyre = { workspace = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc", "std"] }
iroha_fs = { path = "../iroha_fs" }
iroha_config_base = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["json"] }
iroha_data_model = { workspace = true, default-features = false }
iroha_model_base = { workspace = true }
iroha_primitives = { workspace = true }
sorafs_manifest = { workspace = true }
sorafs_node = { path = "../sorafs_node" }
norito = { workspace = true, default-features = false, features = ["base-codec"] }

base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring"] }
time = { workspace = true }
error-stack = { workspace = true }
humantime = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process", "net", "event"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
iroha_operation_journal = { workspace = true }
mv = { workspace = true }
iroha_test_samples = { workspace = true }
iroha_version = { workspace = true }
iroha_core = { workspace = true, default-features = false, features = ["iroha-core-tests"] }
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }
iroha_sumeragi = { workspace = true }
kotodama_lang = { workspace = true }
tempfile = { workspace = true }
