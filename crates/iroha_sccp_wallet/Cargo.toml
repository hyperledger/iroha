[package]
name = "iroha_sccp_wallet"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Local SCCP v1 wallet library: verification, destination encodings, client config and flow journal"

[lints]
workspace = true

# Never linked into irohad: `ci/dependency_budget.json` forbids the `sccp_wallet` layer there.
[dependencies]
iroha = { workspace = true }
iroha_sccp = { workspace = true }
iroha_sccp_rpc = { workspace = true }
iroha_data_model = { workspace = true, default-features = false }
iroha_config = { workspace = true }
# `#[derive(ReadConfig)]` of the client-config `[sccp]` table expands to `::iroha_config_base` paths.
iroha_config_base = { workspace = true }
# Native integration retains the mandatory Wallet-to-SDK proving path.
iroha_wallet = { workspace = true }
iroha_operation_journal = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
hex = { workspace = true, features = ["std"] }
zeroize = { workspace = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }

# Owner-only key files and journal directories: `O_NOFOLLOW` opens and the effective uid.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
tempfile = { workspace = true }
