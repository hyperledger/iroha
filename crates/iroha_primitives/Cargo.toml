[package]
name = "iroha_primitives"
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true

[lints]
workspace = true

[badges]
is-it-maintained-issue-resolution = { repository = "https://github.com/hyperledger-iroha/iroha" }
is-it-maintained-open-issues = { repository = "https://github.com/hyperledger-iroha/iroha" }
maintenance = { status = "actively-developed" }

# Enable JSON helpers backed by Norito.
[features]
default = ["json", "simd-accel"]
# Enable JSON helpers backed by Norito.
json = []
trybuild-tests = ["dep:trybuild"]
bench = []
simd-accel = []

[dependencies]
iroha_allocation = { workspace = true }
norito = { workspace = true, default-features = false, features = ["base-codec"] }
iroha_primitives_derive = { path = "../iroha_primitives_derive" }

iroha_macro = { workspace = true }
iroha_schema = { workspace = true }
blake3 = { workspace = true }

derive_more = { workspace = true, features = ["display", "debug", "from", "as_ref", "deref", "constructor", "into_iterator"] }
smallvec = { version = "1.15.1", default-features = false, features = ["union"] }
thiserror = { workspace = true }
displaydoc = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
# Quantity's bounded JSON decoder accounts for num-bigint 0.4.6's native-digit allocation.
num-bigint = { version = "=0.4.6", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
trybuild = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "smallvec"
harness = false

[[bench]]
name = "rs16"
harness = false

[[test]]
name = "addr_parsing"
path = "tests/addr_parsing.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["trybuild-tests"]

[[test]]
name = "numeric_abi_encoding_allocations"
path = "tests/numeric_abi_encoding_allocations.rs"
