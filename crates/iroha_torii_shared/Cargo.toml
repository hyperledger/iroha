[package]
name = "iroha_torii_shared"

edition.workspace = true
version.workspace = true
authors.workspace = true

description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
iroha_executor_data_model = { workspace = true }
iroha_model_base = { workspace = true }
iroha_schema = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_crypto = { workspace = true, default-features = false, features = ["consensus"] }
iroha_primitives = { workspace = true }
iroha_data_model = { workspace = true, default-features = false }
hex.workspace = true
base64 = { workspace = true }
hkdf = "0.12.4"
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
rand.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.31" }
anyhow = "1.0.103"
hex = { workspace = true }
iroha_data_model = { workspace = true, default-features = false, features = ["test-fixtures", "transparent_api"] }

[features]
default = []
# Enable Connect examples (WS demo) gating to avoid unexpected-cfg warnings
connect = []
