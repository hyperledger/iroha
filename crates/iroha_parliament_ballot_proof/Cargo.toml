[package]
name = "iroha_parliament_ballot_proof"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "State-free experimental Parliament anonymous-ballot relations (registration and vote) over the VOLE-in-the-head backend"

[lints]
workspace = true

[features]
default = []
# Forwards hardware acceleration to the backend; outputs are unchanged.
accel = ["iroha_zkp_vole/accel"]

[dependencies]
iroha_zkp_vole = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Independent SHA-3 implementation the digests and the in-crate Keccak rounds are
# cross-checked against. All hashing of the library itself uses the backend's
# erasing sponge.
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }
