[package]
name = "iroha_parliament_ballot_proof"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "State-free experimental Parliament anonymous-ballot relations (registration and vote) over the VOLE-in-the-head backend"

[lints]
workspace = true

[features]
default = []
# Forwards hardware acceleration to the backend; outputs are unchanged.
accel = ["iroha_zkp_vole/accel"]
# Test and measurement support only (integration decision 6): compiles the comparator
# row `profile::Row::Comparator` for the measurement examples, the comparator
# integration tests, the fuzz crate and the separately built diagnostic drivers.
# Node, wallet and native-bridge dependencies never enable it; production builds
# contain the candidate row only.
diagnostics = []

[dependencies]
iroha_zkp_vole = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Native stack/mapping APIs are used only by the standalone resource worker.
libc = "0.2.177"
# Machine-readable resource observations use the workspace JSON codec.
norito = { workspace = true, default-features = false, features = ["json"] }
# Independent SHA-3 implementation the digests and the in-crate Keccak rounds are
# cross-checked against. All hashing of the library itself uses the backend's
# erasing sponge.
sha3 = { version = "0.10.8", default-features = false, features = ["std"] }

# The measurement and diagnostic tooling compares both rows.
[[example]]
name = "measure"
required-features = ["diagnostics"]

[[example]]
name = "parliament_ballot_qualify"
required-features = ["diagnostics"]

[[example]]
name = "prover_lifecycle"
required-features = ["diagnostics"]

[[example]]
name = "resource_contract"
required-features = ["diagnostics"]
