[package]
name = "iroha_p2p"
autotests = false

edition.workspace = true
version.workspace = true
authors.workspace = true

license.workspace = true
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
iroha_model_base = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
iroha_logger = { workspace = true }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_data_model = { workspace = true, default-features = false }
iroha_primitives = { workspace = true }
iroha_config = { workspace = true }
iroha_futures = { workspace = true }
iroha_telemetry = { workspace = true }
aead = { version = "0.6.0-rc.3", default-features = false }
soranet_pq = { workspace = true }

rand = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
] }
futures = { workspace = true, features = ["alloc"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
displaydoc = { workspace = true }
derive_more = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
socket2 = "0.6.3"
# Authenticated transports. TLS-over-TCP is mandatory in the first release;
# QUIC is the only optional transport.
quinn = { version = "0.11.12", optional = true }
rcgen = "0.14.5"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }

[features]
# Test-only Sumeragi §13.4 mutations; refused in ordinary dependency builds.
mutation-testing = []
# Expose opaque reply-route minting only to dependent-crate test builds.
test-fixtures = []
# Optional QUIC transport; TLS-over-TCP remains the mandatory fallback.
quic = ["dep:quinn"]
[dev-dependencies]
iroha_config_base = { workspace = true }
tokio = { workspace = true, features = ["test-util", "time", "macros"] }
tempfile = { workspace = true }

[[test]]
name = "mod"
path = "tests/mod.rs"
