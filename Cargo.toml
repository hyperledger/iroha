[profile.dev]
incremental = true
# Match [profile.test] so dev and test units share one dependency graph; with
# debug = 0 the value only participates in the profile hash.
split-debuginfo = "unpacked"
# Keep default local workspace builds from producing enormous debug-heavy Linux
# artifacts. Use `CARGO_PROFILE_DEV_DEBUG=line-tables-only` when debugging.
debug = 0

[profile.dev.build-override]
debug = 0
codegen-units = 256
# On macOS 27, stripping host proc-macro debuginfo can misalign the Mach-O
# LINKEDIT string pool and prevent dyld from loading the freshly built tool.
# Keep dev/test host profiles identical, as with their dependency profiles.
strip = "none"

[profile.test]
# Avoid long dsymutil phases on macOS test binaries.
split-debuginfo = "unpacked"
# Keep test harnesses from producing enormous debug-heavy Linux artifacts.
# Use `CARGO_PROFILE_TEST_DEBUG=line-tables-only` when debugging tests.
debug = 0
# Keep long workspace test runs from retaining large incremental-query caches
# on WSL and memory-constrained VMs. Override locally with `CARGO_INCREMENTAL=1`.
incremental = false

[profile.test.build-override]
debug = 0
codegen-units = 256
strip = "none"

[profile.dev.package."*"]
debug = 0
codegen-units = 256
# Package overrides take precedence over build-override for registry proc macros.
strip = "none"

# `iroha_data_model` is a workspace member, so the wildcard dependency override
# above does not apply to it. Its very large generated/derived surface otherwise
# uses 256 incremental dev CGUs. Keep enough partitions to prevent its derived
# decoder IR from coalescing into memory-heavy LLVM modules while avoiding the
# full incremental default. Cargo's native jobserver controls process-level
# parallelism; constrained workflows apply their own memory limits explicitly.
[profile.dev.package.iroha_data_model]
codegen-units = 8

# Preserve compiler settings for definitions moved out of the aggregate model.
[profile.dev.package.iroha_model_base]
codegen-units = 8

[profile.test.package."*"]
debug = 0
codegen-units = 256
strip = "none"

# Native runtime admission and package publication stream complete executable
# contents through BLAKE3 and SHA-256. Normal debug bundles can exceed 2 GB;
# optimize the existing Rust/native hash implementations, preserving all byte
# reads, custody fences, debug assertions and overflow checks in both profiles.
[profile.dev.package.blake3]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.blake3]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true

# Closed renewal profiling found per-byte zeroization and private-filesystem
# helper overhead in unoptimized local builds. Keep the same volatile wipes,
# native custody checks and assertion policy; optimize only their code generation.
# Match both runnable profiles so node and test consumers share this policy.
[profile.dev.package.zeroize]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.zeroize]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.iroha_fs]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.iroha_fs]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Cold native checkpoint recovery retains large orchestration temporaries in
# unoptimized local Deploy builds. Optimize this package's code generation while
# preserving assertion and overflow checks; keep dev and test policy identical.
[profile.dev.package.iroha_deploy]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.test.package.iroha_deploy]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Fresh finality profiling found unoptimized Ed25519 field arithmetic beneath
# optimized iroha_crypto. Match the existing arithmetic dependency policy while
# retaining every public-key, subgroup and signature check in local profiles.
[profile.dev.package.curve25519-dalek]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.test.package.curve25519-dalek]
opt-level = 3
debug-assertions = true
overflow-checks = true

# Local validators execute the production memory-hard authentication puzzle.
# Optimize only its arithmetic dependencies so debug builds can service the
# same bounded authentication lifetime without weakening the puzzle policy.
# Match dev and test profiles to reuse these artifacts between node and harness.
[profile.dev.package.argon2]
opt-level = 3

[profile.test.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3

# The native faucet solver executes the configured memory-hard Scrypt puzzle.
# Optimize its arithmetic in local profiles without changing work or deadlines.
[profile.dev.package.scrypt]
opt-level = 3

[profile.test.package.scrypt]
opt-level = 3

# Four-peer native consensus profiling found BLS signing and verification in
# unoptimized field arithmetic. Optimize the concrete crypto instantiations and
# their arithmetic dependencies in both runnable profiles, retaining assertions
# and overflow checks and sharing artifacts between the node and test harnesses.
[profile.dev.package.iroha_crypto]
opt-level = 3

[profile.test.package.iroha_crypto]
opt-level = 3

[profile.dev.package.w3f-bls]
opt-level = 3

[profile.test.package.w3f-bls]
opt-level = 3

[profile.dev.package.ark-bls12-381]
opt-level = 3

[profile.test.package.ark-bls12-381]
opt-level = 3

[profile.dev.package.ark-ec]
opt-level = 3

[profile.test.package.ark-ec]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3

[profile.test.package.ark-ff]
opt-level = 3

[profile.dev.package.ark-poly]
opt-level = 3

[profile.test.package.ark-poly]
opt-level = 3

[profile.dev.package.ark-serialize]
opt-level = 3

[profile.test.package.ark-serialize]
opt-level = 3

# Optimize the shared halo2curves arithmetic used by proof-system consumers
# in local profiles, preserving debug assertions and overflow checks.
[profile.dev.package.halo2curves]
opt-level = 3

[profile.test.package.halo2curves]
opt-level = 3

# Orchard retains the independent upstream Pasta arithmetic. Preserve
# assertions and overflow checks in both local runnable profiles.
[profile.dev.package.pasta_curves]
opt-level = 3

[profile.test.package.pasta_curves]
opt-level = 3

# Optimize the native Pasta arithmetic and prover kernels in both local
# runnable profiles, keeping debug assertions and overflow checks.
[profile.dev.package.iroha_pasta]
opt-level = 3

[profile.test.package.iroha_pasta]
opt-level = 3

[profile.dev.package.norito]
opt-level = 3

[profile.test.package.norito]
opt-level = 3

# Eight, 16, and 64 CGUs all measured about 12.1 GiB before decoder de-duplication;
# one CGU reached 19.32 GiB. Eight was the lowest measured partition count, and
# the shared decoder engine reduced its exact no-run reproducer to 11.466 GiB.
[profile.test.package.iroha_data_model]
codegen-units = 8

[profile.test.package.iroha_model_base]
codegen-units = 8

# The six-lane native-STARK digest also runs on the live consensus path.
# Match node and test-harness arithmetic: otherwise four-peer checks run an
# unoptimized digest despite fast unit tests and need a second build artifact.
# Both profiles retain overflow checks and debug assertions.
[profile.dev.package.fastpq_isi]
opt-level = 2

[profile.test.package.fastpq_isi]
opt-level = 2

# FASTPQ proving and replay loops live in fastpq_prover, beyond fastpq_isi.
# Optimize that owner identically for local nodes and tests while retaining
# inherited assertions/overflow checks and the full canonical proof geometry.
[profile.dev.package.fastpq_prover]
opt-level = 2

[profile.test.package.fastpq_prover]
opt-level = 2

# `iroha_data_model` is a very broad derive-heavy crate. LLVM `-O3` for this
# one package exceeds the reviewed mobile release-build memory
# envelope even with a single job and hundreds of codegen units. Measured O2
# also crossed the fixed 13 GiB soft ceiling before proof work began, so O1
# avoids that optimizer-only peak. Halo2, core, and the bridge remain at O3.
[profile.release.package.iroha_data_model]
opt-level = 1

[profile.release.package.iroha_model_base]
opt-level = 1

# Cargo otherwise strips debuginfo from host proc macros in release builds.
# On macOS 27 that can misalign the Mach-O LINKEDIT string pool, so dyld
# refuses to load a freshly built proc macro (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"

# Xcode 27 can produce a non-loadable Mach-O addon when Cargo strips this
# dynamic library; preserve symbols for every published native build profile.
[profile.dev.package.iroha_js_host]
strip = "none"

[profile.release.package.iroha_js_host]
strip = "none"

[profile.deploy.package.iroha_js_host]
strip = "none"

# Xcode 27 also emits a non-loadable ABI bridge when Cargo strips its Mach-O
# LINKEDIT string pool. Keep the native library loadable in SDK qualification
# builds and published release/deploy artifacts.
[profile.dev.package.connect_norito_bridge]
strip = "none"

[profile.release.package.connect_norito_bridge]
strip = "none"

[profile.deploy.package.connect_norito_bridge]
strip = "none"

# Xcode 27 applies the same misaligned LINKEDIT string-pool strip to the
# Python extension. Keep the editable/test build and published wheel loadable.
[profile.dev.package.iroha_python_rs]
strip = "none"

[profile.release.package.iroha_python_rs]
strip = "none"

[profile.deploy.package.iroha_python_rs]
strip = "none"

# Apple SDK packaging keeps only the C ABI reachable native closure in each
# static archive. The owning builder selects staticlib alone: the ordinary
# bridge target also emits an rlib, which prevents whole-graph LTO.
[profile.apple-release]
inherits = "release"
lto = "thin"
strip = "none"

# rustc's final ThinLTO pass uses the final crate's optimization level for every
# imported module, the prover and crypto crates included, so run it at their O3.
# The data-model modules stay inside the memory envelope in that pass: the
# aarch64-apple-ios staticlib peaked at 9.9 GB (8.96 GB at O1), 2026-10-18.
[profile.apple-release.package.connect_norito_bridge]
opt-level = 3
strip = "none"

# Fast, incremental optimization for local runnable builds only. This profile
# is not valid for release, packaging, or evidence-producing workflows; those
# use `release` or `deploy`, and Apple SDKs use `apple-release`. Keep the
# data-model optimizer ceiling aligned with the reviewed release policy above.
[profile.local-release]
inherits = "release"
opt-level = 1
codegen-units = 64
incremental = true
lto = false
debug = 0

[profile.local-release.package.iroha_data_model]
opt-level = 1

[profile.local-release.package.iroha_model_base]
opt-level = 1

[profile.deploy]
inherits = "release"
strip = "symbols"
lto = true

[profile.profiling]
inherits = "release"
debug = "limited"
