[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "2.0.0-rc.2.0"
authors = ["Hyperledger Iroha contributors <https://github.com/hyperledger-iroha/iroha/graphs/contributors>"]

description = "Deterministic Byzantine-fault-tolerant ledger for Hyperledger Iroha 3"
repository = "https://github.com/hyperledger-iroha/iroha"
documentation = "https://docs.iroha.tech"
homepage = "https://iroha.tech"

license = "Apache-2.0"
keywords = ["blockchain", "crypto", "iroha", "ledger"]
categories = ["cryptography::cryptocurrencies"]

[workspace.metadata]
docker_bins = [
    "iroha",
    "iroha3d",
    "sorafs_governance_dag",
    "kagami",
    "attachment_sanitizer",
]

[workspace.dependencies]
# Internal dependency features are selected by the consuming crate. Keeping the
# workspace declarations feature-free prevents focused builds from inheriting a
# node-sized graph (or test-only features) accidentally.
iroha_core = { path = "crates/iroha_core", default-features = false }
iroha_core_zk = { path = "crates/iroha_core_zk", default-features = false }
iroha_core_privacy = { path = "crates/iroha_core_privacy", default-features = false }
iroha_core_timed_ovn = { path = "crates/iroha_core_timed_ovn", default-features = false }

iroha_torii = { path = "crates/iroha_torii", default-features = false }
iroha_torii_shared = { path = "crates/iroha_torii_shared" }

iroha = { path = "crates/iroha" }
iroha_private_settlement = { path = "crates/iroha_private_settlement" }
iroha_contract_deploy = { path = "crates/iroha_contract_deploy" }
iroha_deploy = { path = "crates/iroha_deploy" }
iroha_fs = { path = "crates/iroha_fs" }
iroha_operation_journal = { path = "crates/iroha_operation_journal" }
iroha_wallet = { path = "crates/iroha_wallet" }
iroha_storage_client = { path = "crates/iroha_storage_client" }
iroha_musubi_service = { path = "crates/iroha_musubi_service" }

iroha_telemetry = { path = "crates/iroha_telemetry" }
iroha_p2p = { path = "crates/iroha_p2p" }
iroha_petal = { path = "crates/iroha_petal" }
iroha_primitives = { path = "crates/iroha_primitives", default-features = false }
iroha_config = { path = "crates/iroha_config" }
iroha_config_base = { path = "crates/iroha_config_base" }
iroha_derive = { path = "crates/iroha_derive" }
iroha_derive_primitives = { path = "crates/iroha_derive_primitives" }
iroha_schema_gen = { path = "crates/iroha_schema_gen" }
iroha_schema = { path = "crates/iroha_schema", default-features = false }
iroha_logger = { path = "crates/iroha_logger" }
iroha_crypto = { path = "crates/iroha_crypto", default-features = false }
iroha_macro = { path = "crates/iroha_macro", default-features = false }
iroha_futures = { path = "crates/iroha_futures" }
iroha_panic_hook = { path = "crates/iroha_panic_hook" }
iroha_genesis = { path = "crates/iroha_genesis" }
iroha_sccp = { path = "crates/iroha_sccp" }
iroha_sccp_rpc = { path = "crates/iroha_sccp_rpc" }
iroha_sccp_wallet = { path = "crates/iroha_sccp_wallet" }
# The sans-IO Sumeragi consensus core; `iroha_core` hosts its node driver.
iroha_sumeragi = { path = "crates/iroha_sumeragi" }
norito = { path = "crates/norito", default-features = false }
norito_derive = { path = "crates/norito_derive" }
iroha_version = { path = "crates/iroha_version" }
connect_norito_bridge = { path = "crates/connect_norito_bridge" }
fastpq_prover = { path = "crates/fastpq_prover" }
iroha_zkp_halo2 = { path = "crates/iroha_zkp_halo2" }
iroha_zkp_poseidon = { path = "crates/iroha_zkp_poseidon" }
# Experimental VOLE-in-the-head backend and Parliament ballot relations; no profile is selected.
iroha_zkp_vole = { path = "crates/iroha_zkp_vole", default-features = false }
iroha_parliament_ballot_proof = { path = "crates/iroha_parliament_ballot_proof", default-features = false }
# Typed anonymous-ballot protocol layer over the proof crate; binding use stays gated off.
iroha_parliament_ballot = { path = "crates/iroha_parliament_ballot", default-features = false }
# Native PLONK/IPA stack; one first-release proof implementation.
iroha_pasta = { path = "crates/iroha_pasta" }
iroha_plonk = { path = "crates/iroha_plonk" }
iroha_plonk_gadgets = { path = "crates/iroha_plonk_gadgets" }
iroha_plonk_recursion = { path = "crates/iroha_plonk_recursion" }
iroha_kagemusha_proof = { path = "crates/iroha_kagemusha_proof" }
iroha_i18n = { path = "crates/iroha_i18n" }

# Canonical JSON and governance model identities are unconditional.
# Crates request HTTP, crypto implementations and transparent APIs locally.
iroha_data_model = { path = "crates/iroha_data_model", default-features = false }
iroha_model_base = { path = "crates/iroha_model_base", default-features = false }
iroha_js_codec = { path = "crates/iroha_js_codec", default-features = false }
iroha_service_model = { path = "crates/iroha_service_model" }
