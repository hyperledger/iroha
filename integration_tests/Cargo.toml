[package]
name = "integration_tests"
version.workspace = true
edition = "2024"
autobins = false
autotests = false

[lints]
workspace = true

[[bin]]
name = "sorafs-gateway-fixtures"
path = "src/bin/sorafs_gateway_fixtures.rs"
required-features = ["dev-tools"]

[[bin]]
name = "refresh_nexus_streaming_fixtures"
path = "src/bin/refresh_nexus_streaming_fixtures.rs"
required-features = ["dev-tools"]

[[test]]
name = "core_api"
path = "tests/core_api.rs"

[[test]]
name = "events_and_triggers"
path = "tests/events_and_triggers.rs"

[[test]]
name = "queries_and_proofs"
path = "tests/queries_and_proofs.rs"

[[test]]
name = "network_functional"
path = "tests/network_functional.rs"

[[test]]
name = "sora_parliament_lifecycle_smoke"
path = "tests/sora_parliament_lifecycle_smoke.rs"
required-features = ["parliament-test-signers"]

[[test]]
name = "sorafs_publication_governance"
path = "tests/sorafs_publication_governance.rs"
required-features = ["parliament-test-signers"]

[[test]]
name = "sccp_lanes"
path = "tests/sccp_lanes/main.rs"

[[test]]
name = "consensus_and_da"
path = "tests/consensus_and_da.rs"

[[test]]
name = "sumeragi"
path = "tests/sumeragi.rs"

[[test]]
name = "sumeragi_lanes"
path = "tests/sumeragi_lanes.rs"

[[test]]
name = "sumeragi_npos_committee_transition"
path = "tests/sumeragi_npos_committee_transition.rs"

[[test]]
name = "nexus_and_streaming"
path = "tests/nexus_and_streaming.rs"

[[test]]
name = "torii_load_profile"
path = "tests/torii_load_profile.rs"

[features]
default = ["telemetry"]
dev-tools = []
fault_injection = ["iroha_data_model/fault_injection"]
telemetry = ["iroha_core/telemetry"]
quic = ["iroha_core/quic", "iroha_p2p/quic"]
js_host_parity = []
zk-stark = [
    "iroha_core/zk-stark",
    "iroha_data_model/privacy-exact12-conformance",
    "iroha_torii/zk-stark",
    "dep:zk_ace_prover",
]
# Non-shipping native exact-12 fixture builders used only by explicit
# four-peer privacy release gates.
privacy-release-evidence = ["iroha_core/privacy-release-evidence"]
# Explicit, ignored release harness for real-process atomic private settlement.
# The feature owns no fixture/proof bypass; it only keeps the multi-hour native
# proof and sixteen-node topology out of ordinary integration-test binaries.
atomic-private-settlement-release = ["iroha/test-network-private-settlement-evidence"]
# Explicit ignored N=3 smoke over the canonical CPU/ARM SHA3 privacy prover.
atomic-private-settlement-smoke = ["atomic-private-settlement-release"]
# Non-shipping exact-seat threshold-share providers for the dedicated modern
# Parliament four-validator corridor. The test target is absent unless this
# feature is explicitly requested, and Core rejects optimized compilation.
parliament-test-signers = ["iroha_core/test-network-parliament-signers"]

[dependencies]
iroha_allocation = { workspace = true }
iroha_core_privacy = { workspace = true, default-features = false }
iroha_core_timed_ovn = { workspace = true }
iroha_model_base = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt-multi-thread", "time", "test-util"] }
eyre = { workspace = true }
iroha_test_network = { workspace = true }
iroha_data_model = { workspace = true, features = ["application-model", "http", "transparent_api"], default-features = false }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_torii_shared = { workspace = true }
iroha_version = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"] }
sorafs_car = { workspace = true, features = ["manifest"] }
sorafs_manifest = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rand_chacha = { version = "0.9.0", default-features = false, features = ["std"] }
iroha = { workspace = true }
zk_ace_prover = { path = "../crates/zk_ace_prover", optional = true }

[dev-dependencies]
iroha_fs = { workspace = true }
kotodama_lang = { workspace = true }
irohad_lib = { path = "../crates/irohad", default-features = false, features = ["daemon"] }
zeroize = { workspace = true }
iroha_torii = { workspace = true, default-features = false, features = ["node-api", "ws_integration_tests"] }
iroha_service_model = { workspace = true }
iroha_logger = { workspace = true }
iroha_config = { workspace = true }
iroha_config_base = { workspace = true }
iroha_primitives = { workspace = true }
iroha_telemetry = { workspace = true }
iroha_executor_data_model = { workspace = true }
ivm = { workspace = true }
ivm_abi = { workspace = true }
base64 = { workspace = true }

toml = { workspace = true }
futures-util = "0.3.31"
nonzero_ext = { workspace = true }
iroha_test_samples = { workspace = true }
iroha_genesis = { workspace = true }
iroha_core = { workspace = true, features = ["node", "iroha-core-tests"], default-features = false }
iroha_core_zk = { workspace = true, default-features = false, features = ["test-utils"] }
iroha_sumeragi = { workspace = true }
iroha_sccp = { workspace = true }
iroha_p2p = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10.9"
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa"] }
rand_core_06 = { workspace = true }

mint_rose_trigger_data_model = { path = "../data_model/samples/mint_rose_trigger_data_model" }
executor_custom_data_model = { path = "../data_model/samples/executor_custom_data_model" }

assert_matches = "1.5.0"
tempfile = { workspace = true }
ascii_table = "=5.0.0" # pinned for edition/format stability

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }
