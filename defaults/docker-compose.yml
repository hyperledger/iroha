    healthcheck:
      interval: 2s
      retries: 30
      start_period: 4s
      test: 'test $$(curl -s http://127.0.0.1:8083/status/blocks) -gt 0'
      timeout: 1s
    image: hyperledger/iroha:dev
    init: true
    ports:
      - 1340:1340
      - 8083:8083
    pull_policy: missing
    secrets:
      - iroha_genesis_public_key
      - iroha_genesis_expected_hash
    volumes:
      -
        read_only: true
        source: '${IROHA_GENESIS_SIGNED_FILE:?set IROHA_GENESIS_SIGNED_FILE to an owner-prepared signed genesis block}'
        target: /genesis/genesis.signed.nrt
        type: bind
      -
        bind:
          create_host_path: false
        read_only: true
        source: '${IROHA_PEER3_CONFIG_FILE:?set IROHA_PEER3_CONFIG_FILE to this nodes existing owner-0600 TOML}'
        target: /config/peer.toml
        type: bind
