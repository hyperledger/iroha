[network]
address = "addr:0.0.0.0:1337#BF18"
public_address = "addr:127.0.0.1:1337#8F78"

[torii]
address = "addr:0.0.0.0:8080#B922"

[sorafs.storage]
# Embedded storage is a deployment-owned provider role. Enable it only with a
# complete governed gateway-compliance policy and all runtime signer/provider
# bindings; the portable Nexus geometry does not invent those identities.
enabled = false

[sorafs.discovery]
discovery_enabled = true
known_capabilities = ["torii_gateway", "chunk_range_fetch"]

[sorafs.discovery.admission]
enabled = true

[genesis]
public_key = "ed01204164BF554923ECE1FD412D241036D863A6AE430476C898248B8237D77534CFC4"
expected_hash_file = "/run/iroha/genesis.expected_hash"

[streaming]
identity_public_key = "ed01201C61FAF8FE94E253B93114240394F79A607B7FA55F9E5A41EBEC74B88055768B"
identity_private_key_file = "/run/secrets/iroha/nexus-streaming-identity-private-key"
# Advertise support for feedback hints and privacy overlay provider
feature_bits = 0b11

[nexus]
lane_count = 3

[nexus.staking]
stake_asset_id = "xor#universal"

[nexus.storage]
local_budget_bytes = 274877906944

# Lanes are logical workload streams. Their `dataspace` binding names the
# physical validator/storage boundary that owns the lane.
[[nexus.lane_catalog]]
index = 0
alias = "core"
description = "Primary execution lane"
dataspace = "universal"

[[nexus.lane_catalog]]
index = 1
alias = "governance"
description = "Governance & parliament traffic"
dataspace = "universal"

[[nexus.lane_catalog]]
index = 2
alias = "zk"
description = "Zero-knowledge attachments"
dataspace = "universal"

# Physical data spaces only. Namespace, governance-module, and workload names
# must not be promoted into this catalog.
[[nexus.dataspace_catalog]]
alias = "universal"
id = 0
description = "Shared public data space for core, governance, and zero-knowledge lanes"
fault_tolerance = 1

[nexus.routing_policy]
default_lane = 0
default_dataspace = "universal"

[[nexus.routing_policy.rules]]
lane = 1
dataspace = "universal"
matcher.instruction = "governance"
matcher.description = "Route governance instructions to the governance lane in the universal data space"

[[nexus.routing_policy.rules]]
lane = 2
dataspace = "universal"
matcher.instruction = "smartcontract::deploy"
matcher.description = "Route contract deployments to the zk lane in the universal data space"
