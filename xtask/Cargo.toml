[package]
name = "xtask"
autobins = false
autotests = false
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("schema-structural"))',
] }

[[bin]]
name = "torii-mock-harness"
path = "src/bin/torii_mock_harness.rs"
required-features = ["dev-tools"]

[[bin]]
name = "control-plane-mock"
path = "src/bin/control_plane_mock.rs"
required-features = ["dev-tools"]

[[bin]]
name = "compute_gateway"
path = "src/bin/compute_gateway.rs"
required-features = ["dev-tools"]

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["dev-tools"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = []
dev-tools = ["iroha_torii/test-fixtures"]
dev-vote-fixture = ["dep:iroha_pasta", "dep:iroha_plonk", "dep:ff"]

[dependencies]
iroha_model_base = { workspace = true }
iroha_service_model = { workspace = true }
hex = { workspace = true }
norito = { workspace = true, features = ["node-codec", "bench-internal", "simd-accel", "parallel-stage1"], default-features = false }
tempfile = { workspace = true }
iroha_core = { workspace = true, default-features = false, features = ["node"] }
iroha_core_zk = { workspace = true, default-features = false }
iroha_config = { workspace = true }
iroha_torii = { workspace = true, features = [
    "node-api",
    "ws_integration_tests",
    "telemetry",
    "profiling",
    "schema",
    "zk-verify-batch",
], default-features = false }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_data_model = { workspace = true, features = ["application-model", "transparent_api"], default-features = false }
iroha_telemetry = { workspace = true }
iroha_torii_shared = { workspace = true }
iroha_genesis = { workspace = true }
iroha_deploy = { workspace = true }
iroha_fs = { workspace = true }
iroha_primitives = { workspace = true }
iroha = { workspace = true, features = ["test-fixtures"] }
iroha_storage_client = { workspace = true }
ivm = { workspace = true }
kotodama_lang = { workspace = true }
norito_codegen_exporter = { path = "../tools/norito_codegen_exporter" }
mv = { path = "../crates/mv" }
fastpq_isi = { path = "../crates/fastpq_isi" }
arrow-array = { version = "53.4.1", default-features = false }
arrow-schema = { version = "53.4.1", default-features = false }
parquet = { version = "53.4.1", default-features = false, features = ["arrow"] }
iroha_pasta = { workspace = true, optional = true }
iroha_plonk = { workspace = true, optional = true }
ff = { version = "0.13.1", optional = true }
rand_chacha = "0.9.0"
rand = { version = "0.9.2", features = ["std", "std_rng"] }
rand_distr = "0.5.1"
rand_core_06 = { version = "0.6.4", package = "rand_core" }
walkdir = "2.5"
blake2 = { version = "0.10.6", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "rand_core"] }
soranet-handshake-harness = { path = "../tools/soranet-handshake-harness" }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
sorafs_car = { workspace = true }
sorafs_manifest = { path = "../crates/sorafs_manifest", features = ["pqc"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
axum = { workspace = true }
base64 = "0.22.1"
data-encoding = "2.5.0"
zeroize = "1.8.2"
blake3 = { version = "1.8.2" }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
sorafs_chunker = { path = "../crates/sorafs_chunker" }
integration_tests = { path = "../integration_tests" }
time = { version = "0.3.44", features = ["formatting", "macros"] }
thiserror = "2.0.17"
toml = "0.9.8"
eyre = { workspace = true }
once_cell = { workspace = true }
soranet-relay = { path = "../tools/soranet-relay", default-features = false }
soranet_pq = { path = "../crates/soranet_pq" }

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = { workspace = true }
norito = { path = "../crates/norito", default-features = false, features = ["node-codec"] }
