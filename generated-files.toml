[[generated]]
name = "openapi-cargo-lock-pin"
kind = "file"
outputs = ["release/openapi-cargo-lock-v1.txt"]
generator = "node tools/openapi/scripts/provision-openapi-cargo-lock.mjs pin --source=\"$PWD/Cargo.lock\" --output=\"${IROHA_OPENAPI_CARGO_LOCK_PIN_STAGE:?set an absolute external staging path}\""
generator_sources = [
  "tools/openapi/scripts/lib/openapi-safe-file.mjs",
  "tools/openapi/scripts/provision-openapi-cargo-lock.mjs",
]
# Cargo.lock is the tracked root authority; the V1 pin is derived metadata and
# the inventory binds both inputs into the release-source closure.
inputs = ["Cargo.lock", "release/openapi-generator-inputs-v1.txt"]
check = "node tools/openapi/scripts/provision-openapi-cargo-lock.mjs pin --source=\"$PWD/Cargo.lock\" --check=\"$PWD/release/openapi-cargo-lock-v1.txt\""

