# Registry for generated source that intentionally remains checked in.
#
# Each repository-owned generator must provide a read-only drift-check command.
# External entries record pinned provenance when the upstream input is not part
# of this repository. Package, portal, cache, and build outputs are forbidden
# below and must be regenerated in ignored staging directories.
schema_version = 1

[policy]
forbidden_tracked_globs = [
  "dist/**",
  "javascript/iroha_js/dist/**",
  ".swiftpm-build/**",
  "build/**",
  "**/build/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.docusaurus/**",
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.gradle/**",
  "**/.swiftpm/**",
  "**/.cache/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.class",
]
allowed_tracked_paths = ["dist/.gitkeep"]
generated_source_extensions = [
  ".go",
  ".java",
  ".js",
  ".kt",
  ".mjs",
  ".py",
  ".rs",
  ".swift",
  ".ts",
  ".yaml",
  ".yml",
]

