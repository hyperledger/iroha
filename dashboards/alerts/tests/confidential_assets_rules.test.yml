rule_files:
  - ../confidential_assets_rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'iroha_confidential_tree_commitments{asset_id="62Fk4FPcMuLvW5QjDGNF2a4jAmjM"}'
        values: '0 1 2 3 4 5 6'
      - series: 'iroha_confidential_tree_depth{asset_id="62Fk4FPcMuLvW5QjDGNF2a4jAmjM"}'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 6m
        alertname: ConfidentialTreeDepthZero
        exp_alerts:
          - exp_labels:
              severity: page
              asset_id: 62Fk4FPcMuLvW5QjDGNF2a4jAmjM
            exp_annotations:
              summary: "Confidential commitment tree depth dropped to zero"
              description: |
                Asset 62Fk4FPcMuLvW5QjDGNF2a4jAmjM has commitments recorded but the reported tree depth is zero.
                Inspect the frontier checkpoints and root history gauges before allowing additional
                confidential traffic.
